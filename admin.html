<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ALVÉN Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#111;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* LOGO */
.admin-logo{
  text-align:center;
  padding:10px 0 25px;
}

.admin-logo-text{
  font-size:38px;
  font-weight:900;
  letter-spacing:4px;
  color:#111;
}

/* BOX */
.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

/* INPUTS */
input,
select,
textarea{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:7px;
  background:#fff;
  color:#111;
  font-size:15px;
}

select{
  cursor:pointer;
}

/* BUTTONS */
button{
  padding:11px 15px;
  border:0;
  border-radius:7px;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  opacity:.9;
}

.danger{
  background:#b00020;
}

.hidden{
  display:none;
}

/* PRODUCT */
.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin:10px 0;
  display:flex;
  gap:12px;
  align-items:center;
  background:#fff;
}

.product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.product-info{
  flex:1;
  line-height:1.6;
}

/* ORDER */
.order{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
  background:#fff;
  line-height:1.7;
}

.order select{
  max-width:250px;
}

/* LABEL */
label{
  display:block;
  margin-top:5px;
}

/* MOBILE */
@media(max-width:600px){

  .wrap{
    padding:12px;
  }

  .box{
    padding:15px;
  }

  .admin-logo-text{
    font-size:30px;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:60px;
    height:60px;
  }

  .product button{
    padding:9px 10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- ALVÉN LOGO -->
  <div class="admin-logo">
    <div class="admin-logo-text">ALVÉN</div>
  </div>


  <!-- LOGIN -->
  <div id="login" class="box">

    <h2>Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <p id="msg"></p>

  </div>


  <!-- ADMIN PANEL -->
  <div id="panel" class="hidden">


    <!-- TOP CONTROLS -->
    <div class="box">

      <button onclick="logout()">
        LOGOUT
      </button>

      <button onclick="loadOrders()">
        REFRESH ORDERS
      </button>

    </div>


    <!-- ADD PRODUCT -->
    <div class="box">

      <h2>Add Product</h2>


      <!-- PRODUCT NAME -->
      <input
        id="pname"
        placeholder="Product name"
      >


      <!-- PRICE -->
      <input
        id="price"
        type="number"
        step="0.01"
        placeholder="Price AED"
      >


      <!-- CATEGORY -->
      <label>
        <b>Category</b>
      </label>

      <select id="category">

        <option value="SHOES">
          SHOES
        </option>

        <option value="HOODIE">
          HOODIE
        </option>

        <option value="PANTS">
          PANTS
        </option>

        <option value="T-SHIRT">
          T-SHIRT
        </option>

        <option value="STREETWEAR">
          STREETWEAR
        </option>

      </select>


      <!-- BRAND -->
      <input
        id="brand"
        placeholder="Brand"
      >


      <!-- IMAGE -->
      <label>
        <b>Product image — choose from gallery</b>
      </label>

      <input
        id="file"
        type="file"
        accept="image/*"
      >


      <!-- SHOE SIZES -->
      <input
        id="sizes"
        placeholder="Shoe sizes: 39,40,41,42"
      >


      <!-- COLORS -->
      <input
        id="colors"
        placeholder="Colors: Black,White,Red"
      >


      <!-- ADD -->
      <button onclick="addProduct()">
        ADD PRODUCT
      </button>

      <p id="uploadMsg"></p>

    </div>


    <!-- PRODUCTS -->
    <div class="box">

      <h2>Products</h2>

      <div id="products">
        Loading...
      </div>

    </div>


    <!-- ORDERS -->
    <div class="box">

      <h2>Orders</h2>

      <div id="orders">
        Loading...
      </div>

    </div>

  </div>

</div>

/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const r =
  await db.auth.signInWithPassword({

    email:
    document.getElementById('email')
    .value
    .trim(),

    password:
    document.getElementById('password')
    .value

  });


  if(r.error){

    document.getElementById('msg')
    .textContent =
    r.error.message;

    return;
  }


  show();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* =========================================================
   SHOW ADMIN
========================================================= */

async function show(){

  document
  .getElementById('login')
  .classList
  .add('hidden');

  document
  .getElementById('panel')
  .classList
  .remove('hidden');

  loadProducts();

  loadOrders();

}


/* =========================================================
   CHECK SESSION
========================================================= */

async function init(){

  const r =
  await db.auth.getSession();

  if(r.data.session){

    show();

  }

}
