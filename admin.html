<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALVÉN Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{padding:11px 15px;border:0;border-radius:7px;background:#111;color:#fff;cursor:pointer}.danger{background:#b00020}.hidden{display:none}.product,.order{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}.product{display:flex;gap:12px;align-items:center}.product img{width:70px;height:70px;object-fit:cover;border-radius:8px}</style></head><body><div class="wrap"><h1>ALVÉN ADMIN</h1><div id="login" class="box"><h2>Admin Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="msg"></p></div><div id="panel" class="hidden"><div class="box"><button onclick="logout()">LOGOUT</button> <button onclick="loadOrders()">REFRESH ORDERS</button></div><div class="box"><h2>Add Product</h2><input id="pname" placeholder="Product name"><input id="price" type="number" step="0.01" placeholder="Price AED"><input id="category" placeholder="Category"><input id="brand" placeholder="Brand"><label><b>Product image — choose from gallery</b></label><input id="file" type="file" accept="image/*"><input id="sizes" placeholder="Shoe sizes: 39,40,41,42"><input id="colors" placeholder="Colors: Black,White,Red"><button onclick="addProduct()">ADD PRODUCT</button><p id="uploadMsg"></p></div><div class="box"><h2>Products</h2><div id="products">Loading...</div></div><div class="box"><h2>Orders</h2><div id="orders">Loading...</div></div></div></div><script>
const URL='https://oqvyrehcqxsmzpunxeys.supabase.co',KEY='sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a',db=supabase.createClient(URL,KEY),BUCKET='product-images';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function login(){let r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;return}show()}async function logout(){await db.auth.signOut();location.reload()}async function show(){login.classList.add('hidden');panel.classList.remove('hidden');loadProducts();loadOrders()}async function init(){let r=await db.auth.getSession();if(r.data.session)show()}async function addProduct(){let f=file.files[0];if(!pname.value.trim()||!price.value||!f){uploadMsg.textContent='Product name, price and gallery image are required.';return}uploadMsg.textContent='Uploading image...';let ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let u=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(u.error){uploadMsg.textContent='Upload failed: '+u.error.message;return}let url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;let r=await db.from('products').insert({name:pname.value.trim(),price:Number(price.value),category:category.value.trim(),brand:brand.value.trim(),image_url:url,image_urls:JSON.stringify([url]),shoe_sizes:sizes.value.trim(),colors:colors.value.trim()});if(r.error){uploadMsg.textContent='Product save failed: '+r.error.message;return}uploadMsg.textContent='Product added successfully.';pname.value=price.value=category.value=brand.value=sizes.value=colors.value='';file.value='';loadProducts()}async function loadProducts(){let r=await db.from('products').select('*').order('id',{ascending:false});products.innerHTML=r.error?r.error.message:(r.data||[]).map(p=>`<div class="product"><img src="${p.image_url||''}"><div style="flex:1"><b>${esc(p.name)}</b><br>AED ${Number(p.price||0).toFixed(2)}<br>${esc(p.colors||'')}</div><button class="danger" onclick="del(${p.id})">DELETE</button></div>`).join('')||'No products.'}async function del(id){if(!confirm('Delete product?'))return;let r=await db.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);loadProducts()}async function loadOrders(){let r=await db.from('orders').select('*').order('created_at',{ascending:false});orders.innerHTML=r.error?r.error.message:(r.data||[]).map(o=>`<div class="order"><b>Order #${o.id}</b><br><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)}<br><br>${items(o.items)}<br><b>Total: AED ${Number(o.total||0).toFixed(2)}</b><br>Pay on Delivery<br><select onchange="status(${o.id},this.value)"><option ${o.status==='NEW'?'selected':''}>NEW</option><option ${o.status==='CONFIRMED'?'selected':''}>CONFIRMED</option><option ${o.status==='SHIPPED'?'selected':''}>SHIPPED</option><option ${o.status==='DELIVERED'?'selected':''}>DELIVERED</option><option ${o.status==='CANCELLED'?'selected':''}>CANCELLED</option></select></div>`).join('')||'No orders.'}function items(a){try{return (Array.isArray(a)?a:JSON.parse(a||'[]')).map(x=>esc(x.name)+' — '+x.quantity+' × AED '+Number(x.price).toFixed(2)+(x.color?' — '+esc(x.color):'')+(x.size?' — size '+esc(x.size):'')).join('<br>')}catch(e){return ''}}async function status(id,v){let r=await db.from('orders').update({status:v}).eq('id',id);if(r.error)alert(r.error.message)}init();
</script></body></html>
