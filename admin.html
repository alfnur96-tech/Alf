<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALVÉN Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f7f5ef;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1150px;margin:auto;padding:28px 18px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:100px;height:100px;object-fit:contain}
.brand h1{margin:5px 0;letter-spacing:.18em}
.panel{background:#191919;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:18px}
input,select,textarea{width:100%;padding:13px;background:#0f0f0f;border:1px solid #444;color:#fff;border-radius:8px;margin:7px 0 12px;font:inherit}
textarea{min-height:80px}
button{padding:13px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.primary{background:#fff;color:#111}
.danger{background:#b33;color:#fff}
.muted{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}
.card .body{padding:12px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.hidden{display:none}
.size-options{display:flex;flex-wrap:wrap;gap:8px;margin:7px 0 12px}
.size-options label{display:flex;align-items:center;gap:5px;background:#0f0f0f;border:1px solid #444;padding:9px 11px;border-radius:8px;cursor:pointer}
.size-options input{width:auto;margin:0}
.preview{max-width:180px;max-height:180px;display:none;margin:8px 0;border-radius:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.error{color:#ff8585}
.ok{color:#8cff9b}
.order{background:#111;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}
.orderhead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.orderitems{margin:12px 0;padding:10px;background:#181818;border-radius:8px}
.item{padding:8px 0;border-bottom:1px solid #333}
.item:last-child{border-bottom:0}
.badge{display:inline-block;padding:6px 9px;border-radius:20px;background:#333;font-size:11px}
.ordergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.statusrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.statusrow select{max-width:180px;margin:0}
.refresh{margin-left:8px}

@media(max-width:750px){
.grid,.products,.ordergrid{grid-template-columns:1fr}
.top{display:block}
.top button{margin-top:10px}
.orderhead{display:block}
.statusrow select,.statusrow button{max-width:none;width:100%}
}
</style>
</head>

<body>

<div class="wrap">

<div class="brand">
<img src="alven-logo.jpg" alt="ALVÉN">
<h1>ALVÉN</h1>
<div class="muted">ADMIN PANEL</div>
</div>


<!-- LOGIN -->

<section id="login" class="panel">

<h2>Admin Sign In</h2>

<div class="muted">
Sign in with your Supabase admin account.
</div>

<input
id="email"
type="email"
placeholder="Admin email"
autocomplete="username"
>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginBtn" class="primary">
SIGN IN
</button>

<p id="loginMsg" class="error"></p>

</section>


<!-- ADMIN APP -->

<section id="app" class="hidden">


<div class="panel top">

<div>
<b>ALVÉN Admin</b>
<div class="muted">Products + customer orders</div>
</div>

<div>

<button class="primary" onclick="openStore()">
OPEN SHOP
</button>

<button id="logoutBtn">
LOG OUT
</button>

</div>

</div>


<!-- ORDERS -->

<section class="panel">

<div class="top">

<div>

<h2 style="margin:0">
Orders
</h2>

<div class="muted">
Customer orders placed through the website.
</div>

</div>

<button
class="primary refresh"
onclick="loadOrders()"
>
REFRESH ORDERS
</button>

</div>

<p id="ordersMsg"></p>

<div id="orders">

<div class="muted">
Loading orders...
</div>

</div>

</section>


<!-- ADD PRODUCT -->

<section class="panel">

<h2>Add Product</h2>

<div class="grid">


<div>

<label>Product name</label>

<input
id="name"
placeholder="e.g. ALVÉN Hoodie"
>

</div>


<div>

<label>Price (AED)</label>

<input
id="price"
type="number"
min="0"
step="1"
placeholder="150"
>

</div>


<div>

<label>Category</label>

<select id="category">

<option>SHOES</option>
<option>HOODIE</option>
<option>PANTS</option>
<option>T-SHIRT</option>
<option>STREETWEAR</option>

</select>

</div>


<div id="brandWrap">

<label>Shoe brand</label>

<select id="brand">

<option>ADIDAS</option>
<option>NIKE</option>
<option>PUMA</option>
<option>JORDAN</option>
<option>NEW BALANCE</option>
<option>LOUIS VUITTON</option>
<option>GUCCI</option>
<option>BALENCIAGA</option>
<option>DIOR</option>
<option>PRADA</option>
<option>OTHER BRANDS</option>

</select>


<label>Shoe number</label>

<div
id="shoeSizes"
class="size-options"
></div>

<div class="muted">
Select all available shoe numbers.
</div>

</div>


<div>

<label>Product colors</label>

<input
id="colors"
placeholder="Black, White, Red"
>

<div class="muted">
Separate multiple colors with commas.
</div>

</div>


<div>

<label>
Product image — choose from phone gallery
</label>

<input
id="image"
type="file"
accept="image/*"
multiple
>

<img
id="preview"
class="preview"
alt="Preview"
>

</div>

</div>


<button
id="addBtn"
class="primary"
>
UPLOAD IMAGE + ADD PRODUCT
</button>

<p id="msg"></
