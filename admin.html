<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ALVÉN Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f3ef;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:15px 18px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  height:40px;
  max-width:150px;
  object-fit:contain;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

h1,h2{
  margin:0 0 14px;
}

label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin:12px 0 6px;
}

input,
select,
button{
  font:inherit;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 15px;
  cursor:pointer;
  font-weight:700;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#111;
  color:#fff;
}

.danger{
  background:#b00020;
  color:#fff;
}

.ghost{
  background:#eee;
  color:#111;
}

.green{
  background:#16733b;
  color:#fff;
}

.location{
  background:#111;
  color:#fff;
}

.small{
  padding:8px 10px;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.msg{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  font-size:13px;
  background:#eef6ee;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.photos{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo{
  position:relative;
  width:88px;
  height:110px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.photo button{
  position:absolute;
  right:3px;
  top:3px;
  padding:4px 7px;
  background:#fff;
  color:#b00020;
}

.product{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:12px;
  align-items:center;
  border-top:1px solid #eee;
  padding:12px 0;
}

.product img{
  width:75px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.meta{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.login{
  max-width:420px;
  margin:10vh auto;
}


/* ================================
   ORDERS
================================ */

.order{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  background:#fff;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.order-title{
  font-weight:800;
  font-size:16px;
}

.order-date{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.order-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.order-info div{
  background:#f7f7f7;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  word-break:break-word;
}

.order-info strong{
  display:block;
  font-size:10px;
  color:#777;
  margin-bottom:4px;
}

.order-items{
  margin-top:12px;
  background:#fafafa;
  border-radius:10px;
  padding:12px;
}

.items-title{
  font-size:11px;
  font-weight:800;
  margin-bottom:10px;
}

.item-box{
  border-top:1px solid #e5e5e5;
  padding:10px 0;
}

.item-box:first-child{
  border-top:0;
  padding-top:0;
}

.item-name{
  font-weight:800;
  font-size:14px;
}

.item-detail{
  font-size:12px;
  color:#555;
  margin-top:4px;
}

.item-price{
  font-size:12px;
  font-weight:700;
  margin-top:5px;
}

.order-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.status{
  width:auto;
  min-width:135px;
  padding:8px 10px;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product{
    grid-template-columns:60px 1fr;
  }

  .product .actions{
    grid-column:1/-1;
  }

  .product img{
    width:60px;
    height:70px;
  }

  .order-info{
    grid-template-columns:1fr;
  }

  .order-top{
    flex-direction:column;
  }

  .status{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

<img
  class="logo"
  src="alven-logo.png"
  alt="ALVÉN"
  onerror="this.style.display='none'"
>

<button
  id="logoutBtn"
  class="ghost small hidden"
  onclick="logout()"
>
LOG OUT
</button>

</header>


<main class="wrap">


<!-- =========================================
     LOGIN
========================================= -->

<section id="login" class="card login">

<h1>ALVÉN Admin</h1>

<p>
Sign in with your Supabase admin account.
</p>

<label>Email</label>

<input
  id="email"
  type="email"
  placeholder="Admin email"
>

<label>Password</label>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button
  class="primary"
  style="margin-top:14px"
  onclick="login()"
>
SIGN IN
</button>

<div
  id="loginMsg"
  class="msg hidden"
></div>

</section>



<!-- =========================================
     ADMIN APP
========================================= -->

<section id="app" class="hidden">


<!-- =========================================
     ORDERS
========================================= -->

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
"
>

<h2>
Orders
</h2>

<button
class="ghost small"
onclick="loadOrders()"
>
REFRESH
</button>

</div>

<div
id="ordersMsg"
class="msg hidden"
></div>

<div id="orders">

<p>
Loading orders...
</p>

</div>

</div>



<!-- =========================================
     PRODUCT FORM
========================================= -->

<div class="card">

<h1 id="formTitle">
Add Product
</h1>

<div
id="msg"
class="msg hidden"
></div>

<div class="grid">


<!-- NAME -->

<div>

<label>
PRODUCT NAME *
</label>

<input
id="name"
placeholder="Product name"
>

</div>


<!-- PRICE -->

<div>

<label>
PRICE (AED) *
</label>

<input
id="price"
type="number"
min="0"
step="0.01"
placeholder="250"
>

</div>


<!-- CATEGORY -->

<div>

<label>
CATEGORY *
</label>

<select
id="category"
onchange="categoryChanged()"
>

<option value="SHOES">
SHOES
</option>

<option value="HOODIE">
HOODIE
</option>

<option value="PANTS">
PANTS
</option>

<option value="T-SHIRT">
T-SHIRT
</option>

<option value="STREETWEAR">
STREETWEAR
</option>

</select>

</div>


<!-- BRAND -->

<div id="brandBox">

<label>
BRAND
</label>

<select id="brand">

<option value="">
Other / No Brand
</option>

<option>ADIDAS</option>
<option>NIKE</option>
<option>PUMA</option>
<option>JORDAN</option>
<option>NEW BALANCE</option>
<option>LOUIS VUITTON</option>
<option>GUCCI</option>
<option>BALENCIAGA</option>
<option>DIOR</option>
<option>PRADA</option>
<option>OTHER BRANDS</option>

</select>

</div>


<!-- COLORS -->

<div class="full">

<label>
COLORS
</label>

<input
id="colors"
placeholder="Black, White, Red"
>

</div>


<!-- SHOE SIZES -->

<div
id="sizesBox"
class="full"
>

<label>
SHOE SIZES
</label>

<input
id="shoeSizes"
placeholder="38, 39, 40, 41, 42, 43, 44"
>

</div>


<!-- PHOTOS -->

<div class="full">

<label>
PRODUCT PHOTOS
</label>

<input
id="files"
type="file"
accept="image/*"
multiple
onchange="previewFiles()"
>

<div
id="photos"
class="photos"
></div>

<small>
You can select multiple photos.
The first photo becomes the main product photo.
</small>

</div>

</div>


<div
class="actions"
style="margin-top:16px"
>

<button
id="saveBtn"
class="primary"
onclick="saveProduct()"
>
ADD PRODUCT
</button>

<button
id="cancelBtn"
class="ghost hidden"
onclick="resetForm()"
>
CANCEL EDIT
</button>

</div>

</div>



<!-- =========================================
     PRODUCTS
========================================= -->

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
"
>

<h2>
Products
</h2>

<button
class="ghost small"
onclick="loadProducts()"
>
REFRESH
</button>

</div>

<input
id="search"
placeholder="Search products..."
oninput="renderProducts()"
>

<div id="products">

<p>
Loading...
</p>

</div>

</div>


</section>

</main>



<script>

/* =========================================
   SUPABASE SETTINGS
========================================= */

const SUPABASE_URL =
'https://oqvyrehcqxsmzpunxeys.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a';

const BUCKET =
'products';


/* =========================================
   VARIABLES
========================================= */

let session = null;

let products = [];

let orders = [];

let editingId = null;

let selectedFiles = [];

let existingImages = [];


/* =========================================
   SHORTCUT
========================================= */

const $ = id =>
document.getElementById(id);


/* =========================================
   ESCAPE
========================================= */

const esc = s =>
String(s ?? '').replace(
/[&<>"']/g,
m => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);


/* =========================================
   HEADERS
========================================= */

function headers(extra = {}){

return Object.assign(

{
apikey:SUPABASE_KEY,

Authorization:
'Bearer ' +
(
session?.access_token ||
SUPABASE_KEY
),

'Content-Type':
'application/json'
},

extra

);

}


/* =========================================
   MESSAGE
========================================= */

function message(text,error=false){

$('msg').textContent = text;

$('msg')
.classList
.remove('hidden');

$('msg').style.background =
error
? '#ffe5e8'
: '#eef6ee';

}


/* =========================================
   LOGIN
========================================= */

async function login(){

const email =
$('email').value.trim();

const password =
$('password').value;

if(!email || !password){

$('loginMsg').textContent =
'Enter email and password.';

$('loginMsg')
.classList
.remove('hidden');

return;

}

try{

const response =
await fetch(

SUPABASE_URL +
'/auth/v1/token?grant_type=password',

{
method:'POST',

headers:{
apikey:SUPABASE_KEY,
'Content-Type':'application/json'
},

body:JSON.stringify({
email:email,
password:password
})

}

);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
'Login failed'
);

}

session = data;

localStorage.setItem(
'alven_admin_session',
JSON.stringify(data)
);

showApp();

loadProducts();

loadOrders();

}catch(error){

$('loginMsg').textContent =
error.message;

$('loginMsg')
.classList
.remove('hidden');

}

}


/* =========================================
   RESTORE LOGIN
========================================= */

function restore(){

try{

session =
JSON.parse(
localStorage.getItem(
'alven_admin_session'
) || 'null'
);

}catch(error){

session = null;

}

if(session?.access_token){

showApp();

loadProducts();

loadOrders();

}

}


/* =========================================
   SHOW ADMIN
========================================= */

function showApp(){

$('login')
.classList
.add('hidden');

$('app')
.classList
.remove('hidden');

$('logoutBtn')
.classList
.remove('hidden');

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

localStorage.removeItem(
'alven_admin_session'
);

location.reload();

}


/* =========================================
   CATEGORY
========================================= */

function categoryChanged(){

const shoes =
$('category').value === 'SHOES';

$('sizesBox')
.classList
.toggle(
'hidden',
!shoes
);

$('brandBox')
.classList
.toggle(
'hidden',
!shoes
);

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

editingId = null;

selectedFiles = [];

existingImages = [];

$('formTitle').textContent =
'Add Product';

$('saveBtn').textContent =
'ADD PRODUCT';

$('cancelBtn')
.classList
.add('hidden');

$('name').value = '';

$('price').value = '';

$('category').value =
'SHOES';

$('brand').value = '';

$('colors').value = '';

$('shoeSizes').value = '';

$('files').value = '';

$('photos').innerHTML = '';

categoryChanged();

}


/* =========================================
   PHOTO PREVIEW
========================================= */

function previewFiles(){

selectedFiles =
Array.from(
$('files').files || []
);

renderPhotos();

}


/* =========================================
   RENDER PHOTOS
========================================= */

function renderPhotos(){

const box =
$('photos');

box.innerHTML = '';

existingImages.forEach(
(url,index)=>{

const div =
document.createElement('div');

div.className =
'photo';

div.innerHTML =
`
<img src="${esc(url)}">

<button
type="button"
onclick="removeExisting(${index})"
>
×
</button>
`;

box.appendChild(div);

}
);


selectedFiles.forEach(
(file,index)=>{

const div =
document.createElement('div');

div.className =
'photo';

const img =
document.createElement('img');

img.src =
URL.createObjectURL(file);

const button =
document.createElement('button');

button.type =
'button';

button.textContent =
'×';

button.onclick = ()=>{

selectedFiles.splice(
index,
1
);

renderPhotos();

};

div.appendChild(img);

div.appendChild(button);

box.appendChild(div);

}
);

}


/* =========================================
   REMOVE EXISTING IMAGE
========================================= */

function removeExisting(index){

existingImages.splice(
index,
1
);

renderPhotos();

}


/* =========================================
   LIST PARSER
========================================= */

function parseList(value){

return value
.split(',')
.map(x=>x.trim())
.filter(Boolean);

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadFile(file){

const extension =
(
file.name
.split('.')
.pop() ||
'jpg'
)
.toLowerCase()
.replace(
/[^a-z0-9]/g,
''
);

const path =
'products/' +
Date.now() +
'-' +
Math.random()
.toString(36)
.slice(2) +
'.' +
extension;

const response =
await fetch(

SUPABASE_URL +
'/storage/v1/object/' +
BUCKET +
'/' +
path,

{
method:'POST',

headers:{

apikey:
SUPABASE_KEY,

Authorization:
'Bearer ' +
(
session?.access_token ||
SUPABASE_KEY
),

'Content-Type':
file.type ||
'image/jpeg',

'x-upsert':
'false'

},

body:file

}

);

if(!response.ok){

throw new Error(
'Image upload failed: ' +
await response.text()
);

}

return (

SUPABASE_URL +

'/storage/v1/object/public/' +

BUCKET +

'/' +

path

);

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

const name =
$('name').value.trim();

const price =
Number(
$('price').value
);

const category =
$('category').value;

if(
!name ||
!Number.isFinite(price)
){

message(
'Product name and price are required.',
true
);

return;

}

$('saveBtn').disabled =
true;

try{

message(
'Saving product...'
);

let urls =
[...existingImages];

for(
const file of selectedFiles
){

const url =
await uploadFile(file);

urls.push(url);

}

if(!urls.length){

throw new Error(
'Please select at least one product photo.'
);

}

const payload = {

name:name,

price:price,

category:category,

brand:
category === 'SHOES'
? (
$('brand').value ||
null
)
: null,

image_url:
urls[0],

image_urls:
urls,

shoe_sizes:
category === 'SHOES'
? parseList(
$('shoeSizes').value
)
: [],

colors:
parseList(
$('colors').value
)

};

let response;


/* EDIT */

if(editingId){

response =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
encodeURIComponent(
editingId
),

{
method:'PATCH',

headers:
headers({
'Prefer':
'return=minimal'
}),

body:
JSON.stringify(payload)

}

);

}


/* ADD */

else{

response =
await fetch(

SUPABASE_URL +
'/rest/v1/products',

{
method:'POST',

headers:
headers({
'Prefer':
'return=minimal'
}),

body:
JSON.stringify(payload)

}

);

}

if(!response.ok){

throw new Error(
await response.text()
);

}

message(
editingId
? 'Product updated successfully.'
: 'Product added successfully.'
);

resetForm();

await loadProducts();

}catch(error){

message(
error.message,
true
);

}finally{

$('saveBtn').disabled =
false;

}

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

$('products').innerHTML =
'<p>Loading...</p>';

try{

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/products?' +
'select=id,name,price,category,brand,image_url,image_urls,shoe_sizes,colors' +
'&order=id.desc',

{
headers:
headers()
}

);

if(!response.ok){

throw new Error(
await response.text()
);

}

products =
await response.json();

renderProducts();

}catch(error){

$('products').innerHTML =
`
<div class="msg">
${esc(error.message)}
</div>
`;

}

}


/* =========================================
   GET PRODUCT IMAGES
========================================= */

function imgs(product){

if(
Array.isArray(
product.image_urls
) &&
product.image_urls.length
){

return product.image_urls;

}

if(
typeof product.image_urls ===
'string'
){

try{

const array =
JSON.parse(
product.image_urls
);

if(
Array.isArray(array)
){

return array;

}

}catch(error){}

}

return product.image_url
? [product.image_url]
: [];

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

const query =
$('search')
.value
.toLowerCase()
.trim();

const list =
products.filter(
product =>

!query ||

[
product.name,
product.category,
product.brand
]
.join(' ')
.toLowerCase()
.includes(query)

);

if(!list.length){

$('products').innerHTML =
'<p>No products found.</p>';

return;

}

$('products').innerHTML =
list.map(
product=>{

const image =
imgs(product)[0] ||
'';

return `

<div class="product">

<img
src="${esc(image)}"
alt=""
>

<div>

<b>
${esc(product.name)}
</b>

<div class="meta">

AED
${Number(
product.price || 0
).toFixed(0)}

·

${esc(
product.category || ''
)}

${
product.brand
? ' · ' +
esc(product.brand)
: ''
}

</div>

</div>

<div class="actions">

<button
class="ghost small"
onclick='editProduct(${JSON.stringify(String(product.id))})'
>
EDIT
</button>

<button
class="danger small"
onclick='deleteProduct(${JSON.stringify(String(product.id))})'
>
DELETE
</button>

</div>

</div>

`;

}
).join('');

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

const product =
products.find(
item =>
String(item.id) ===
String(id)
);

if(!product){

return;

}

editingId =
product.id;

existingImages =
imgs(product);

selectedFiles =
[];

$('formTitle').textContent =
'Edit Product';

$('saveBtn').textContent =
'UPDATE PRODUCT';

$('cancelBtn')
.classList
.remove('hidden');

$('name').value =
product.name || '';

$('price').value =
product.price ?? '';

$('category').value =
product.category ||
'SHOES';

$('brand').value =
product.brand || '';

if(
Array.isArray(
product.colors
)
){

$('colors').value =
product.colors.join(', ');

}else{

$('colors').value =
product.colors || '';

}

let sizes =
product.shoe_sizes;

if(
typeof sizes ===
'string'
){

try{

sizes =
JSON.parse(sizes);

}catch(error){

sizes =
parseList(sizes);

}

}

$('shoeSizes').value =
Array.isArray(sizes)
? sizes.join(', ')
: '';

$('files').value =
'';

renderPhotos();

categoryChanged();

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

const product =
products.find(
item =>
String(item.id) ===
String(id)
);

if(
!product ||
!confirm(
'Delete "' +
product.name +
'"?'
)
){

return;

}

try{

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
encodeURIComponent(id),

{
method:'DELETE',

headers:
headers()
}

);

if(!response.ok){

throw new Error(
await response.text()
);

}

await loadProducts();

message(
'Product deleted.'
);

}catch(error){

message(
error.message,
true
);

}

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

$('orders').innerHTML =
'<p>Loading orders...</p>';

try{

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/orders?select=*&order=id.desc',

{
headers:
headers()
}

);

throw new Error(
await response.text()
);

await response.json();

renderOrders();

}catch(error){

`
<div
class="msg"
style="background:#ffe5e8"
>
${esc(error.message)}
</div>

/* =========================================
   GET ORDER FIELD
========================================= */

function orderValue(order,names){

for(
const name of names
){

if(
order[name] !== undefined &&
order[name] !== null &&
order[name] !== ''
){

return order[name];

}

}

return '';

}


/* =========================================
   PARSE ANY JSON VALUE
========================================= */

function parseMaybeJSON(value){

if(
typeof value !== 'string'
){

return value;

}

try{

return JSON.parse(value);

}catch(error){

return value;

}

}


/* =========================================
   FORMAT ORDER ITEMS
   SHOWS NAME + COLOR + SIZE
========================================= */

function formatOrderItems(order){

let items =
orderValue(
order,
[
'items',
'products',
'order_items'
]
);

if(!items){

return `
<div class="item-box">
<div class="item-detail">
No item details saved with this order.
</div>
</div>
`;

}

items =
parseMaybeJSON(items);


/*
  Sometimes an order has one object
  instead of an array.
*/

if(
!Array.isArray(items)
){

if(
typeof items === 'object' &&
items !== null
){

items = [items];

}else{

return `
<div class="item-box">
<div class="item-detail">
${esc(String(items))}
</div>
</div>
`;

}

}


return items.map(
(item,index)=>{

/*
  If item is only text
*/

if(
typeof item === 'string'
){

return `

<div class="item-box">

<div class="item-name">

${index + 1}. ${esc(item)}

</div>

</div>

`;

}


/*
  PRODUCT NAME
*/

const name =
item.name ||
item.product_name ||
item.productName ||
item.title ||
item.product ||
'Product';


/*
  QUANTITY
*/

const quantity =
item.quantity ??
item.qty ??
item.count ??
1;


/*
  COLOR
*/

let color =
item.color ??
item.colour ??
item.selected_color ??
item.selectedColor ??
item.product_color ??
'';


/*
  SIZE
*/

let size =
item.size ??
item.selected_size ??
item.selectedSize ??
item.shoe_size ??
item.shoeSize ??
item.product_size ??
'';


/*
  PRICE
*/

const price =
item.price ??
item.unit_price ??
item.product_price ??
'';


/*
  TOTAL
*/

const itemTotal =
item.total ??
item.item_total ??
'';


/*
  Handle nested options
*/

if(
(!color || !size) &&
item.options &&
typeof item.options === 'object'
){

color =
color ||
item.options.color ||
item.options.colour ||
'';

size =
size ||
item.options.size ||
item.options.shoe_size ||
'';

}


/*
  Handle nested variant
*/

if(
(!color || !size) &&
item.variant &&
typeof item.variant === 'object'
){

color =
color ||
item.variant.color ||
item.variant.colour ||
'';

size =
size ||
item.variant.size ||
item.variant.shoe_size ||
'';

}


/*
  Build item
*/

let html = `

<div class="item-box">

<div class="item-name">

${index + 1}.
${esc(name)}
× ${esc(quantity)}

</div>
`;


/* COLOR */

if(color){

html += `

<div class="item-detail">

🎨 <strong>Color:</strong>
${esc(color)}

</div>

`;

}else{

html += `

<div class="item-detail">

🎨 <strong>Color:</strong>
Not provided

</div>

`;

}


/* SIZE */

if(size){

html += `

<div class="item-detail">

📏 <strong>Size:</strong>
${esc(size)}

</div>

`;

}else{

html += `

<div class="item-detail">

📏 <strong>Size:</strong>
Not provided

</div>

`;

}


/* PRICE */

if(price !== ''){

html += `

<div class="item-price">

Price: AED ${esc(price)}

</div>

`;

}


/* ITEM TOTAL */

if(itemTotal !== ''){

html += `

<div class="item-price">

Item total: AED ${esc(itemTotal)}

</div>

`;

}


html += `

</div>
`;

return html;

}
).join('');

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

if(!orders.length){

$('orders').innerHTML =
'<p>No orders yet.</p>';

return;

}

$('orders').innerHTML =
orders.map(
order=>{

const id =
orderValue(
order,
[
'id',
'order_id',
'order_number'
]
);

const name =
orderValue(
order,
[
'customer_name',
'name',
'full_name'
]
);

const phone =
orderValue(
order,
[
'phone',
'customer_phone',
'whatsapp'
]
);

const address =
orderValue(
order,
[
'address',
'delivery_address',
'customer_address'
]
);

const total =
orderValue(
order,
[
'total',
'total_price',
'amount',
'price'
]
);

const method =
orderValue(
order,
[
'payment_method',
'order_method',
'method'
]
);

const date =
orderValue(
order,
[
'created_at',
'date',
'order_date'
]
);

const status =
orderValue(
order,
[
'status',
'order_status'
]
) || 'NEW';


/*
  LOCATION
*/

const locationUrl =
order.location_url ||
(
order.latitude &&
order.longitude
?
`https://www.google.com/maps?q=${order.latitude},${order.longitude}`
: ''
);


/*
  ITEMS
*/

const itemsHTML =
formatOrderItems(order);


return `

<div class="order">


<div class="order-top">

<div>

<div class="order-title">

ORDER #${esc(id)}

</div>

<div class="order-date">

${esc(date || '')}

</div>

</div>


<select
class="status"
onchange="
updateOrderStatus(
${JSON.stringify(String(id))},
this.value
)
"
>

<option
value="NEW"
${status === 'NEW' ? 'selected' : ''}
>
NEW
</option>

<option
value="CONFIRMED"
${status === 'CONFIRMED' ? 'selected' : ''}
>
CONFIRMED
</option>

<option
value="DELIVERED"
${status === 'DELIVERED' ? 'selected' : ''}
>
DELIVERED
</option>

<option
value="CANCELLED"
${status === 'CANCELLED' ? 'selected' : ''}
>
CANCELLED
</option>

</select>

</div>



<div class="order-info">


<div>

<strong>
CUSTOMER
</strong>

${esc(name || '—')}

</div>


<div>

<strong>
PHONE
</strong>

${esc(phone || '—')}

</div>


<div>

<strong>
ADDRESS
</strong>

${esc(address || '—')}

</div>


<div>

<strong>
TOTAL
</strong>

AED ${esc(total || '0')}

</div>


<div>

<strong>
PAYMENT / METHOD
</strong>

${esc(method || '—')}

</div>


</div>



<div class="order-items">

<div class="items-title">
ORDER ITEMS
</div>

${itemsHTML}

</div>



<div class="order-actions">


${
phone
?
`
<a
href="https://wa.me/${String(phone).replace(/[^0-9]/g,'')}"
target="_blank"
rel="noopener"
style="text-decoration:none"
>

<button
class="green small"
>
WHATSAPP
</button>

</a>
`
:
''
}


${
locationUrl
?
`
<a
href="${esc(locationUrl)}"
target="_blank"
rel="noopener"
style="text-decoration:none"
>

<button
class="location small"
>
📍 VIEW LOCATION
</button>

</a>
`
:
`
<button
class="ghost small"
disabled
>
📍 NO LOCATION
</button>
`
}


<button
class="danger small"
onclick="
deleteOrder(
${JSON.stringify(String(id))}
)
"
>
DELETE ORDER
</button>


</div>


</div>

`;

}
).join('');

}


/* =========================================
   UPDATE ORDER STATUS
========================================= */

async function updateOrderStatus(
id,
status
){

try{

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/orders?id=eq.' +
encodeURIComponent(id),

{
method:'PATCH',

headers:
headers({
'Prefer':
'return=minimal'
}),

body:
JSON.stringify({
status:status
})

}

);

if(!response.ok){

throw new Error(
await response.text()
);

}

await loadOrders();

}catch(error){

alert(
'Could not update order: ' +
error.message
);

}

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(id){

const order =
orders.find(
item =>
String(
orderValue(
item,
[
'id',
'order_id',
'order_number'
]
)
) === String(id)
);

const customer =
order
?
orderValue(
order,
[
'customer_name',
'name',
'full_name'
]
)
: '';

if(
!confirm(
'Delete this order' +
(
customer
? ' from ' + customer
: ''
) +
'?\n\nThis cannot be undone.'
)
){

return;

}

try{

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/orders?id=eq.' +
encodeURIComponent(id),

{
method:'DELETE',

headers:
headers({
'Prefer':
'return=minimal'
})

}

);

if(!response.ok){

throw new Error(
await response.text()
);

}

await loadOrders();

$('ordersMsg').textContent =
'Order deleted successfully.';

$('ordersMsg')
.classList
.remove('hidden');

$('ordersMsg')
.style.background =
'#eef6ee';

}catch(error){

$('ordersMsg').textContent =
'Could not delete order: ' +
error.message;

$('ordersMsg')
.classList
.remove('hidden');

$('ordersMsg')
.style.background =
'#ffe5e8';

}

}

restore();
