<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ALVÉN Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f3ef;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  height:40px;
  max-width:150px;
  object-fit:contain;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

h1,h2,h3{
  margin-top:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:12px 0 6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
  font:inherit;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#111;
  color:#fff;
}

.danger{
  background:#b00020;
  color:#fff;
}

.green{
  background:#14753c;
  color:#fff;
}

.ghost{
  background:#eee;
  color:#111;
}

.location{
  background:#111;
  color:#fff;
}

.small{
  padding:8px 11px;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.msg{
  padding:11px;
  border-radius:9px;
  margin:10px 0;
  background:#eef6ee;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.login{
  max-width:420px;
  margin:10vh auto;
}


/* =========================
   OPEN STORE
========================= */

.open-store{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}


/* =========================
   PHOTOS
========================= */

.photos{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo{
  position:relative;
  width:90px;
  height:110px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.photo button{
  position:absolute;
  right:3px;
  top:3px;
  padding:4px 8px;
  background:#fff;
  color:#b00020;
}


/* =========================
   PRODUCTS
========================= */

.product{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:12px;
  align-items:center;
  border-top:1px solid #eee;
  padding:12px 0;
}

.product img{
  width:75px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.meta{
  color:#666;
  font-size:12px;
  margin-top:4px;
}


/* =========================
   ORDERS
========================= */

.order{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  background:#fff;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.order-title{
  font-size:16px;
  font-weight:800;
}

.order-date{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.order-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.order-info div{
  background:#f7f7f7;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  word-break:break-word;
}

.order-info strong{
  display:block;
  color:#777;
  font-size:10px;
  margin-bottom:4px;
}

.order-items{
  margin-top:12px;
  padding:12px;
  background:#fafafa;
  border-radius:10px;
}

.items-title{
  font-size:11px;
  font-weight:800;
  margin-bottom:8px;
}

.item-box{
  border-top:1px solid #e5e5e5;
  padding:10px 0;
}

.item-box:first-child{
  border-top:0;
  padding-top:0;
}

.item-name{
  font-weight:800;
  font-size:14px;
}

.item-detail{
  font-size:12px;
  color:#555;
  margin-top:4px;
}

.item-price{
  font-size:12px;
  font-weight:700;
  margin-top:5px;
}

.order-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.status{
  width:auto;
  min-width:140px;
  padding:8px 10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product{
    grid-template-columns:60px 1fr;
  }

  .product .actions{
    grid-column:1/-1;
  }

  .product img{
    width:60px;
    height:70px;
  }

  .order-info{
    grid-template-columns:1fr;
  }

  .order-top{
    flex-direction:column;
  }

  .status{
    width:100%;
  }

}
</style>
</head>

<body>


<header>

  <img
    class="logo"
    src="alven-logo.png"
    alt="ALVÉN"
    onerror="this.style.display='none'"
  >

  <button
    id="logoutBtn"
    class="ghost small hidden"
    onclick="logout()"
  >
    LOG OUT
  </button>

</header>


<main class="wrap">


<!-- =========================
     LOGIN
========================= -->

<section
  id="login"
  class="card login"
>

  <h1>ALVÉN Admin</h1>

  <p>
    Sign in to manage your store.
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="primary"
    style="margin-top:14px"
    onclick="login()"
  >
    SIGN IN
  </button>

  <div
    id="loginMsg"
    class="msg hidden"
  ></div>

</section>



<!-- =========================
     ADMIN APP
========================= -->

<section
  id="app"
  class="hidden"
>


<!-- =========================
     OPEN STORE
========================= -->

<div class="open-store">

  <button
    class="primary"
    onclick="openStore()"
  >
    🛍 OPEN STORE
  </button>

  <button
    class="ghost"
    onclick="loadOrders()"
  >
    🔄 REFRESH ORDERS
  </button>

</div>



<!-- =========================
     ORDERS
========================= -->

<div class="card">

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    "
  >

    <h2>
      Orders
