<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ALVÉN Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f3ef;
  color:#111;
}

/* HEADER */

header{
  background:#111;
  color:#fff;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  height:40px;
  max-width:150px;
  object-fit:contain;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

/* BUTTONS */

button,
a{
  font:inherit;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.white{
  background:#fff;
  color:#111;
}

.ghost{
  background:#eee;
  color:#111;
}

.danger{
  background:#b00020;
  color:#fff;
}

.success{
  background:#176b35;
  color:#fff;
}

.small{
  padding:7px 10px;
  font-size:12px;
}

/* LAYOUT */

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  max-width:430px;
  margin:10vh auto;
}

h1,
h2,
h3{
  margin-top:0;
}

label{
  display:block;
  margin:12px 0 6px;
  font-size:12px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* ADMIN NAV */

.admin-nav{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.nav-btn{
  padding:14px;
  background:#eee;
  border-radius:10px;
  text-align:center;
  font-weight:700;
  cursor:pointer;
}

.nav-btn.active{
  background:#111;
  color:#fff;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

/* MESSAGES */

.msg{
  padding:11px;
  border-radius:9px;
  margin:10px 0;
  background:#eef6ee;
  font-size:13px;
}

.msg.error{
  background:#ffe5e8;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* PHOTOS */

.photos{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo{
  width:88px;
  height:110px;
  position:relative;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.photo button{
  position:absolute;
  right:3px;
  top:3px;
  padding:3px 7px;
  background:#fff;
  color:#b00020;
}

/* PRODUCTS */

.product{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:12px;
  align-items:center;
  border-top:1px solid #eee;
  padding:12px 0;
}

.product:first-child{
  border-top:0;
}

.product img{
  width:75px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.meta{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

/* ORDERS */

.order{
  border:1px solid #ddd;
  border-radius:12px;
  margin-top:12px;
  overflow:hidden;
  background:#fff;
}

.order-top{
  padding:14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  background:#fafafa;
  border-bottom:1px solid #eee;
}

.order-body{
  padding:14px;
}

.order-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:6px 0;
  font-size:14px;
}

.order-label{
  color:#666;
}

.order-items{
  background:#f7f7f7;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
}

.status{
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  display:inline-block;
}

.status-new{
  background:#fff1c7;
  color:#795d00;
}

.status-confirmed{
  background:#dcecff;
  color:#164a80;
}

.status-delivered{
  background:#dcf5e3;
  color:#176b35;
}

.status-cancelled{
  background:#ffe1e5;
  color:#9b001b;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.stat-number{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

/* STORE BUTTON */

.open-store{
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#111;
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
}

/* MOBILE */

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .admin-nav{
    grid-template-columns:1fr 1fr 1fr;
  }

  .nav-btn{
    font-size:12px;
    padding:12px 5px;
  }

  .product{
    grid-template-columns:60px 1fr;
  }

  .product .actions{
    grid-column:1/-1;
  }

  .product img{
    width:60px;
    height:70px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .order-top{
    align-items:flex-start;
    flex-direction:column;
  }

}

@media(max-width:430px){

  .wrap{
    padding:10px;
  }

  header{
    padding:12px;
  }

  .logo{
    height:32px;
  }

  .open-store{
    font-size:10px;
    padding:8px;
  }

  .stats{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <img
    class="logo"
    src="alven-logo.png"
    alt="ALVÉN"
    onerror="this.style.display='none'"
  >

  <div class="header-actions">

    <a
      class="open-store"
      href="https://alvenstore.vercel.app/"
      target="_blank"
    >
      🛍️ OPEN STORE
    </a>

    <button
      id="logoutBtn"
      class="ghost small hidden"
      onclick="logout()"
    >
      LOG OUT
    </button>

  </div>

</header>



<main class="wrap">


<!-- =========================================
     LOGIN
========================================= -->

<section
  id="login"
  class="card login"
>

  <h1>
    ALVÉN Admin
  </h1>

  <p>
    Sign in with your Supabase admin account.
  </p>

  <label>
    Email
  </label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>
    Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="primary"
    style="margin-top:14px;width:100%;"
    onclick="login()"
  >
    SIGN IN
  </button>

  <div
    id="loginMsg"
    class="msg hidden"
  ></div>

</section>



<!-- =========================================
     ADMIN APP
========================================= -->

<section
  id="app"
  class="hidden"
>


<!-- NAVIGATION -->

<div class="admin-nav">

  <div
    id="ordersTab"
    class="nav-btn active"
    onclick="showSection('orders')"
  >
    📦 ORDERS
  </div>

  <div
    id="productsTab"
    class="nav-btn"
    onclick="showSection('products')"
  >
    🛍️ PRODUCTS
  </div>

  <div
    class="nav-btn"
    onclick="openStore()"
  >
    🌐 STORE
  </div>

</div>



<!-- =========================================
     ORDERS SECTION
========================================= -->

<section
  id="ordersSection"
>


  <!-- ORDER STATS -->

  <div class="stats">

    <div class="stat">

      <div
        id="totalOrders"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        TOTAL ORDERS
      </div>

    </div>


    <div class="stat">

      <div
        id="newOrders"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        NEW ORDERS
      </div>

    </div>


    <div class="stat">

      <div
        id="orderRevenue"
        class="stat-number"
      >
        AED 0
      </div>

      <div class="stat-label">
        TOTAL VALUE
      </div>

    </div>

  </div>



  <div class="card">

    <div
      style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      "
    >

      <h2>
        Orders
      </h2>

      <button
        class="ghost small"
        onclick="loadOrders()"
      >
        REFRESH
      </button>

    </div>


    <input
      id="orderSearch"
      placeholder="Search customer, phone or order..."
      oninput="renderOrders()"
    >


    <div
      id="orders"
    >
      <p>
        Loading orders...
      </p>
    </div>

  </div>


</section>



<!-- =========================================
     PRODUCTS SECTION
========================================= -->

<section
  id="productsSection"
  class="hidden"
>


<!-- PRODUCT FORM -->

<div class="card">

  <h1 id="formTitle">
    Add Product
  </h1>

  <div
    id="msg"
    class="msg hidden"
  ></div>


  <div class="grid">


    <!-- PRODUCT NAME -->

    <div>

      <label>
        PRODUCT NAME *
      </label>

      <input
        id="name"
        placeholder="Product name"
      >

    </div>



    <!-- PRICE -->

    <div>

      <label>
        PRICE (AED) *
      </label>

      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="250"
      >

    </div>



    <!-- CATEGORY -->

    <div>

      <label>
        CATEGORY *
      </label>

      <select
        id="category"
        onchange="categoryChanged()"
      >

        <option value="SHOES">
          SHOES
        </option>

        <option value="HOODIE">
          HOODIE
        </option>

        <option value="PANTS">
          PANTS
        </option>

        <option value="T-SHIRT">
          T-SHIRT
        </option>

        <option value="STREETWEAR">
          STREETWEAR
        </option>

      </select>

    </div>



    <!-- BRAND -->

    <div id="brandBox">

      <label>
        BRAND
      </label>

      <select id="brand">

        <option value="">
          Other / No Brand
        </option>

        <option>
          ADIDAS
        </option>

        <option>
          NIKE
        </option>

        <option>
          PUMA
        </option>

        <option>
          JORDAN
        </option>

        <option>
          NEW BALANCE
        </option>

        <option>
          LOUIS VUITTON
        </option>

        <option>
          GUCCI
        </option>

        <option>
          BALENCIAGA
        </option>

        <option>
          DIOR
        </option>

        <option>
          PRADA
        </option>

        <option>
          OTHER BRANDS
        </option>

      </select>

    </div>



    <!-- COLORS -->

    <div class="full">

      <label>
        COLORS
      </label>

      <input
        id="colors"
        placeholder="Black, White, Red"
      >

    </div>



    <!-- SHOE SIZES -->

    <div
      id="sizesBox"
      class="full"
    >

      <label>
        SHOE SIZES
      </label>

      <input
        id="shoeSizes"
        placeholder="38, 39, 40, 41, 42, 43, 44"
      >

    </div>



    <!-- PRODUCT PHOTOS -->

    <div class="full">

      <label>
        PRODUCT PHOTOS
      </label>

      <input
        id="files"
        type="file"
        accept="image/*"
        multiple
        onchange="previewFiles()"
      >

      <div
        id="photos"
        class="photos"
      ></div>

      <small>
        You can select multiple photos.
        The first photo is the main product photo.
      </small>

    </div>

  </div>



  <div
    class="actions"
    style="margin-top:16px"
  >

    <button
      id="saveBtn"
      class="primary"
      onclick="saveProduct()"
    >
      ADD PRODUCT
    </button>

    <button
      id="cancelBtn"
      class="ghost hidden"
      onclick="resetForm()"
    >
      CANCEL EDIT
    </button>

  </div>

</div>



<!-- PRODUCT LIST -->

<div class="card">

  <div
    style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    "
  >

    <h2>
      Products
    </h2>

    <button
      class="ghost small"
      onclick="loadProducts()"
    >
      REFRESH
    </button>

  </div>


  <input
    id="search"
    placeholder="Search products..."
    oninput="renderProducts()"
  >


  <div id="products">
    <p>
      Loading...
    </p>
  </div>

</div>

</section>

</section>

</main>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
'https://oqvyrehcqxsmzpunxeys.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a';

const BUCKET =
'products';


/* =========================================
   VARIABLES
========================================= */

let session = null;

let products = [];

let orders = [];

let editingId = null;

let selectedFiles = [];

let existingImages = [];


const $ =
id => document.getElementById(id);


const esc =
s =>
String(s ?? '')
.replace(
  /[&<>"']/g,
  m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m])
);


/* =========================================
   SUPABASE HEADERS
========================================= */

function headers(extra = {}){

  return Object.assign(

    {
      apikey:SUPABASE_KEY,

      Authorization:
      'Bearer ' +
      (
        session?.access_token ||
        SUPABASE_KEY
      ),

      'Content-Type':
      'application/json'

    },

    extra

  );

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
  $('email').value.trim();

  const password =
  $('password').value;


  if(!email || !password){

    $('loginMsg').textContent =
    'Enter email and password.';

    $('loginMsg')
    .classList
    .remove('hidden');

    return;

  }


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/auth/v1/token?grant_type=password',

      {
        method:'POST',

        headers:{
          apikey:SUPABASE_KEY,
          'Content-Type':
          'application/json'
        },

        body:
        JSON.stringify({
          email,
          password
        })

      }

    );


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        'Login failed'
      );

    }


    session =
    data;


    localStorage.setItem(
      'alven_admin_session',
      JSON.stringify(data)
    );


    showApp();

    loadOrders();

    loadProducts();


  }catch(error){

    $('loginMsg').textContent =
    error.message;

    $('loginMsg')
    .classList
    .remove('hidden');

  }

}


/* =========================================
   RESTORE SESSION
========================================= */

function restore(){

  try{

    session =
    JSON.parse(
      localStorage.getItem(
        'alven_admin_session'
      ) || 'null'
    );

  }catch(error){

    session = null;

  }


  if(session?.access_token){

    showApp();

    loadOrders();

    loadProducts();

  }

}


/* =========================================
   SHOW APP
========================================= */

function showApp(){

  $('login')
  .classList
  .add('hidden');

  $('app')
  .classList
  .remove('hidden');

  $('logoutBtn')
  .classList
  .remove('hidden');

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  localStorage.removeItem(
    'alven_admin_session'
  );

  location.reload();

}


/* =========================================
   OPEN STORE
========================================= */

function openStore(){

  window.open(
    'https://alvenstore.vercel.app/',
    '_blank'
  );

}


/* =========================================
   SECTION SWITCH
========================================= */

function showSection(section){

  $('ordersSection')
  .classList
  .toggle(
    'hidden',
    section !== 'orders'
  );


  $('productsSection')
  .classList
  .toggle(
    'hidden',
    section !== 'products'
  );


  $('ordersTab')
  .classList
  .toggle(
    'active',
    section === 'orders'
  );


  $('productsTab')
  .classList
  .toggle(
    'active',
    section === 'products'
  );


  if(section === 'orders'){

    loadOrders();

  }


  if(section === 'products'){

    loadProducts();

  }

}


/* =========================================
   ORDER FIELD HELPER
========================================= */

function orderValue(order, names){

  for(
    const name of names
  ){

    if(
      order[name] !== undefined &&
      order[name] !== null
    ){

      return order[name];

    }

  }

  return '';

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  $('orders').innerHTML =
  '<p>Loading orders...</p>';


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/orders?' +
      'select=*' +
      '&order=id.desc',

      {
        headers:
        headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    orders =
    await response.json();


    updateOrderStats();

    renderOrders();


  }catch(error){

    $('orders').innerHTML = `

      <div class="msg error">

        Could not load orders.

        <br><br>

        ${esc(error.message)}

        <br><br>

        Make sure your Supabase
        database has an <b>orders</b>
        table.

      </div>

    `;

  }

}


/* =========================================
   ORDER STATS
========================================= */

function updateOrderStats(){

  const total =
  orders.length;


  const newCount =
  orders.filter(
    order => {

      const status =
      String(
        orderValue(
          order,
          ['status','order_status']
        )
      ).toLowerCase();

      return (
        !status ||
        status === 'new' ||
        status === 'pending'
      );

    }
  ).length;


  let revenue = 0;


  orders.forEach(
    order => {

      revenue += Number(
        orderValue(
          order,
          [
            'total',
            'total_price',
            'amount',
            'price'
          ]
        )
      ) || 0;

    }
  );


  $('totalOrders')
  .textContent =
  total;


  $('newOrders')
  .textContent =
  newCount;


  $('orderRevenue')
  .textContent =
  'AED ' +
  revenue.toFixed(0);

}


/* =========================================
   ORDER STATUS
========================================= */

function statusClass(status){

  const s =
  String(status || 'NEW')
  .toLowerCase();


  if(
    s === 'confirmed'
  ){

    return 'status-confirmed';

  }


  if(
    s === 'delivered'
  ){

    return 'status-delivered';

  }


  if(
    s === 'cancelled' ||
    s === 'canceled'
  ){

    return 'status-cancelled';

  }


  return 'status-new';

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

  const query =
  $('orderSearch')
  .value
  .toLowerCase()
  .trim();


  const filtered =
  orders.filter(
    order => {

      const text =
      JSON.stringify(order)
      .toLowerCase();

      return (
        !query ||
        text.includes(query)
      );

    }
  );


  if(!filtered.length){

    $('orders').innerHTML =
    '<p>No orders found.</p>';

    return;

  }


  $('orders').innerHTML =
  filtered.map(
    order => {

      const id =
      orderValue(
        order,
        ['id','order_id','order_number']
      );


      const customer =
      orderValue(
        order,
        [
          'customer_name',
          'name',
          'full_name'
        ]
      ) ||
      'Customer';


      const phone =
      orderValue(
        order,
        [
          'phone',
          'customer_phone',
          'whatsapp'
        ]
      );


      const address =
      orderValue(
        order,
        [
          'address',
          'delivery_address',
          'customer_address'
        ]
      );


      const total =
      orderValue(
        order,
        [
          'total',
          'total_price',
          'amount',
          'price'
        ]
      );


      const method =
      orderValue(
        order,
        [
          'payment_method',
          'order_method',
          'method'
        ]
      );


      const date =
      orderValue(
        order,
        [
          'created_at',
          'date',
          'order_date'
        ]
      );


      const status =
      orderValue(
        order,
        [
          'status',
          'order_status'
        ]
      ) ||
      'NEW';


      let items =
      orderValue(
        order,
        [
          'items',
          'products',
          'order_items'
        ]
      );


      if(
        typeof items === 'string'
      ){

        try{

          items =
          JSON.parse(items);

        }catch(error){}

      }


      let itemsHTML =
      '';


      if(
        Array.isArray(items)
      ){

        itemsHTML =
        items.map(
          item => {

            const name =
            item.name ||
            item.product_name ||
            'Product';


            const quantity =
            item.quantity ||
            item.qty ||
            1;


            return `
              <div>
                ${esc(name)}
                × ${esc(quantity)}
              </div>
            `;

          }
        ).join('');

      }else if(items){

        itemsHTML =
        esc(items);

      }else{

        itemsHTML =
        'Product information not available';

      }


      let formattedDate =
      date;


      if(date){

        try{

          formattedDate =
          new Date(date)
          .toLocaleString();

        }catch(error){}

      }


      return `

      <div class="order">

        <div class="order-top">

          <div>

            <strong>
              Order #${esc(id)}
            </strong>

            <div
              style="
              font-size:12px;
              color:#777;
              margin-top:4px;
              "
            >
              ${esc(formattedDate)}
            </div>

          </div>


          <span
            class="status ${statusClass(status)}"
          >
            ${esc(
              String(status)
              .toUpperCase()
            )}
          </span>

        </div>


        <div class="order-body">


          <div class="order-row">

            <span class="order-label">
              Customer
            </span>

            <strong>
              ${esc(customer)}
            </strong>

          </div>


          <div class="order-row">

            <span class="order-label">
              Phone
            </span>

            <span>
              ${esc(phone || '-')}
            </span>

          </div>


          <div class="order-row">

            <span class="order-label">
              Address
            </span>

            <span>
              ${esc(address || '-')}
            </span>

          </div>


          <div class="order-row">

            <span class="order-label">
              Method
            </span>

            <span>
              ${esc(method || '-')}
            </span>

          </div>


          <div class="order-row">

            <span class="order-label">
              Total
            </span>

            <strong>
              AED
              ${Number(total || 0).toFixed(2)}
            </strong>

          </div>


          <div class="order-items">

            <strong>
              Products
            </strong>

            <div
              style="
              margin-top:7px;
              font-size:13px;
              line-height:1.7;
              "
            >
              ${itemsHTML}
            </div>

          </div>


          <div
            class="actions"
            style="margin-top:12px"
          >

            <select
              onchange="changeOrderStatus(${JSON.stringify(String(id))},this.value)"
              style="width:auto;min-width:150px"
            >

              <option
                value="NEW"
                ${String(status).toUpperCase()==='NEW'?'selected':''}
              >
                NEW
              </option>

              <option
                value="CONFIRMED"
                ${String(status).toUpperCase()==='CONFIRMED'?'selected':''}
              >
                CONFIRMED
              </option>

              <option
                value="DELIVERED"
                ${String(status).toUpperCase()==='DELIVERED'?'selected':''}
              >
                DELIVERED
              </option>

              <option
                value="CANCELLED"
                ${String(status).toUpperCase()==='CANCELLED'?'selected':''}
              >
                CANCELLED
              </option>

            </select>


            <button
              class="danger small"
              onclick="deleteOrder(${JSON.stringify(String(id))})"
            >
              DELETE ORDER
            </button>

          </div>

        </div>

      </div>

      `;

    }
  ).join('');

}


/* =========================================
   CHANGE ORDER STATUS
========================================= */

async function changeOrderStatus(
  id,
  status
){

  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/orders?id=eq.' +
      encodeURIComponent(id),

      {
        method:'PATCH',

        headers:
        headers({
          'Prefer':
          'return=minimal'
        }),

        body:
        JSON.stringify({
          status:status
        })

      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    await loadOrders();

  }catch(error){

    alert(
      'Could not update order: ' +
      error.message
    );

  }

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(id){

  if(
    !confirm(
      'Delete this order permanently?'
    )
  ){

    return;

  }


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/orders?id=eq.' +
      encodeURIComponent(id),

      {
        method:'DELETE',
        headers:headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    await loadOrders();

  }catch(error){

    alert(
      'Could not delete order: ' +
      error.message
    );

  }

}


/* =========================================
   CATEGORY
========================================= */

function categoryChanged(){

  const shoes =
  $('category').value ===
  'SHOES';


  $('sizesBox')
  .classList
  .toggle(
    'hidden',
    !shoes
  );


  $('brandBox')
  .classList
  .toggle(
    'hidden',
    !shoes
  );

}


/* =========================================
   PRODUCT FORM RESET
========================================= */

function resetForm(){

  editingId = null;

  selectedFiles = [];

  existingImages = [];


  $('formTitle').textContent =
  'Add Product';


  $('saveBtn').textContent =
  'ADD PRODUCT';


  $('cancelBtn')
  .classList
  .add('hidden');


  $('name').value = '';

  $('price').value = '';

  $('category').value =
  'SHOES';

  $('brand').value = '';

  $('colors').value = '';

  $('shoeSizes').value = '';

  $('files').value = '';

  $('photos').innerHTML = '';


  categoryChanged();

}


/* =========================================
   PREVIEW FILES
========================================= */

function previewFiles(){

  selectedFiles =
  Array.from(
    $('files').files || []
  );

  renderPhotos();

}


/* =========================================
   RENDER PHOTOS
========================================= */

function renderPhotos(){

  const box =
  $('photos');


  box.innerHTML = '';


  existingImages.forEach(
    (url,index)=>{

      const div =
      document.createElement(
        'div'
      );

      div.className =
      'photo';


      div.innerHTML = `

        <img
          src="${esc(url)}"
        >

        <button
          type="button"
          onclick="removeExisting(${index})"
        >
          ×
        </button>

      `;


      box.appendChild(div);

    }
  );


  selectedFiles.forEach(
    (file,index)=>{

      const div =
      document.createElement(
        'div'
      );

      div.className =
      'photo';


      const image =
      document.createElement(
        'img'
      );

      image.src =
      URL.createObjectURL(file);


      const button =
      document.createElement(
        'button'
      );

      button.type =
      'button';

      button.textContent =
      '×';


      button.onclick = ()=>{

        selectedFiles.splice(
          index,
          1
        );

        renderPhotos();

      };


      div.appendChild(image);

      div.appendChild(button);

      box.appendChild(div);

    }
  );

}


/* =========================================
   REMOVE EXISTING PHOTO
========================================= */

function removeExisting(index){

  existingImages.splice(
    index,
    1
  );

  renderPhotos();

}


/* =========================================
   PARSE LIST
========================================= */

function parseList(value){

  return value
  .split(',')
  .map(
    item =>
    item.trim()
  )
  .filter(Boolean);

}


/* =========================================
   UPLOAD PRODUCT IMAGE
========================================= */

async function uploadFile(file){

  const extension =
  (
    file.name
    .split('.')
    .pop() ||
    'jpg'
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9]/g,
    ''
  );


  const path =
  'products/' +
  Date.now() +
  '-' +
  Math.random()
  .toString(36)
  .slice(2) +
  '.' +
  extension;


  const response =
  await fetch(

    SUPABASE_URL +
    '/storage/v1/object/' +
    BUCKET +
    '/' +
    path,

    {
      method:'POST',

      headers:{

        apikey:
        SUPABASE_KEY,

        Authorization:
        'Bearer ' +
        (
          session?.access_token ||
          SUPABASE_KEY
        ),

        'Content-Type':
        file.type ||
        'image/jpeg',

        'x-upsert':
        'false'

      },

      body:file

    }

  );


  if(!response.ok){

    throw new Error(
      'Image upload failed: ' +
      await response.text()
    );

  }


  return (

    SUPABASE_URL +
    '/storage/v1/object/public/' +
    BUCKET +
    '/' +
    path

  );

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

  const name =
  $('name').value.trim();


  const price =
  Number(
    $('price').value
  );


  const category =
  $('category').value;


  if(
    !name ||
    !Number.isFinite(price)
  ){

    showProductMessage(
      'Product name and price are required.',
      true
    );

    return;

  }


  $('saveBtn').disabled =
  true;


  try{

    showProductMessage(
      'Saving product...'
    );


    let urls =
    [...existingImages];


    for(
      const file of selectedFiles
    ){

      const url =
      await uploadFile(file);

      urls.push(url);

    }


    if(!urls.length){

      throw new Error(
        'Please select at least one product photo.'
      );

    }


    const payload = {

      name:name,

      price:price,

      category:category,

      brand:
      category === 'SHOES'
      ? (
          $('brand').value ||
          null
        )
      : null,

      image_url:
      urls[0],

      image_urls:
      urls,

      shoe_sizes:
      category === 'SHOES'
      ? parseList(
          $('shoeSizes').value
        )
      : [],

      colors:
      parseList(
        $('colors').value
      )

    };


    let response;


    if(editingId){

      response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/products?id=eq.' +
        encodeURIComponent(
          editingId
        ),

        {
          method:'PATCH',

          headers:
          headers({
            'Prefer':
            'return=minimal'
          }),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }else{

      response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/products',

        {
          method:'POST',

          headers:
          headers({
            'Prefer':
            'return=minimal'
          }),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    showProductMessage(
      editingId
      ? 'Product updated successfully.'
      : 'Product added successfully.'
    );


    resetForm();

    await loadProducts();


  }catch(error){

    showProductMessage(
      error.message,
      true
    );

  }finally{

    $('saveBtn').disabled =
    false;

  }

}


/* =========================================
   PRODUCT MESSAGE
========================================= */

function showProductMessage(
  text,
  error=false
){

  $('msg').textContent =
  text;


  $('msg')
  .classList
  .remove('hidden');


  $('msg')
  .classList
  .toggle(
    'error',
    error
  );

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  $('products').innerHTML =
  '<p>Loading...</p>';


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/products?' +
      'select=id,name,price,category,brand,image_url,image_urls,shoe_sizes,colors' +
      '&order=id.desc',

      {
        headers:
        headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    products =
    await response.json();


    renderProducts();


  }catch(error){

    $('products').innerHTML = `

      <div class="msg error">

        ${esc(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================
   GET PRODUCT IMAGES
========================================= */

function imgs(product){

  if(
    Array.isArray(
      product.image_urls
    ) &&
    product.image_urls.length
  ){

    return product.image_urls;

  }


  if(
    typeof product.image_urls ===
    'string'
  ){

    try{

      const array =
      JSON.parse(
        product.image_urls
      );


      if(
        Array.isArray(array)
      ){

        return array;

      }

    }catch(error){}

  }


  return product.image_url
  ? [product.image_url]
  : [];

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const query =
  $('search')
  .value
  .toLowerCase()
  .trim();


  const list =
  products.filter(
    product =>

    !query ||

    [
      product.name,
      product.category,
      product.brand
    ]
    .join(' ')
    .toLowerCase()
    .includes(query)

  );


  if(!list.length){

    $('products').innerHTML =
    '<p>No products found.</p>';

    return;

  }


  $('products').innerHTML =
  list.map(
    product => {

      const image =
      imgs(product)[0] ||
      '';


      return `

      <div class="product">

        <img
          src="${esc(image)}"
          alt=""
        >


        <div>

          <b>
            ${esc(product.name)}
          </b>


          <div class="meta">

            AED
            ${Number(
              product.price || 0
            ).toFixed(0)}

            ·

            ${esc(
              product.category || ''
            )}

            ${
              product.brand
              ? ' · ' +
                esc(product.brand)
              : ''
            }

          </div>

        </div>


        <div class="actions">

          <button
            class="ghost small"
            onclick='editProduct(${JSON.stringify(String(product.id))})'
          >
            EDIT
          </button>


          <button
            class="danger small"
            onclick='deleteProduct(${JSON.stringify(String(product.id))})'
          >
            DELETE
          </button>

        </div>

      </div>

      `;

    }
  ).join('');

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

  const product =
  products.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(!product){

    return;

  }


  editingId =
  product.id;


  existingImages =
  imgs(product);


  selectedFiles =
  [];


  $('formTitle').textContent =
  'Edit Product';


  $('saveBtn').textContent =
  'UPDATE PRODUCT';


  $('cancelBtn')
  .classList
  .remove('hidden');


  $('name').value =
  product.name || '';


  $('price').value =
  product.price ?? '';


  $('category').value =
  product.category ||
  'SHOES';


  $('brand').value =
  product.brand || '';


  if(
    Array.isArray(
      product.colors
    )
  ){

    $('colors').value =
    product.colors.join(', ');

  }else{

    $('colors').value =
    product.colors || '';

  }


  let sizes =
  product.shoe_sizes;


  if(
    typeof sizes ===
    'string'
  ){

    try{

      sizes =
      JSON.parse(sizes);

    }catch(error){

      sizes =
      parseList(sizes);

    }

  }


  $('shoeSizes').value =
  Array.isArray(sizes)
  ? sizes.join(', ')
  : '';


  $('files').value =
  '';


  renderPhotos();

  categoryChanged();


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

  const product =
  products.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(
    !product ||
    !confirm(
      'Delete "' +
      product.name +
      '"?'
    )
  ){

    return;

  }


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/products?id=eq.' +
      encodeURIComponent(id),

      {
        method:'DELETE',

        headers:
        headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    await loadProducts();


    showProductMessage(
      'Product deleted.'
    );


  }catch(error){

    showProductMessage(
      error.message,
      true
    );

  }

}


/* =========================================
   START
========================================= */

categoryChanged();

restore();

</script>
