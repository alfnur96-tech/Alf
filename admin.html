<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ALVÉN Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f3ef;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:15px 18px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  height:40px;
  max-width:150px;
  object-fit:contain;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

h1,h2{
  margin:0 0 14px;
}

label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin:12px 0 6px;
}

input,
select,
button{
  font:inherit;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.danger{
  background:#b00020;
  color:#fff;
}

.ghost{
  background:#eee;
}

.small{
  padding:8px 10px;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.msg{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  font-size:13px;
  background:#eef6ee;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.photos{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo{
  position:relative;
  width:88px;
  height:110px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.photo button{
  position:absolute;
  right:3px;
  top:3px;
  padding:4px 7px;
  background:#fff;
  color:#b00020;
}

.product{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:12px;
  align-items:center;
  border-top:1px solid #eee;
  padding:12px 0;
}

.product img{
  width:75px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.meta{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.login{
  max-width:420px;
  margin:10vh auto;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product{
    grid-template-columns:60px 1fr;
  }

  .product .actions{
    grid-column:1/-1;
  }

  .product img{
    width:60px;
    height:70px;
  }
}
</style>
</head>

<body>

<header>

  <img
    class="logo"
    src="alven-logo.png"
    alt="ALVÉN"
    onerror="this.style.display='none'"
  >

  <button
    id="logoutBtn"
    class="ghost small hidden"
    onclick="logout()"
  >
    LOG OUT
  </button>

</header>


<main class="wrap">


<!-- LOGIN -->

<section id="login" class="card login">

  <h1>ALVÉN Admin</h1>

  <p>
    Sign in with your Supabase admin account.
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="primary"
    style="margin-top:14px"
    onclick="login()"
  >
    SIGN IN
  </button>

  <div
    id="loginMsg"
    class="msg hidden"
  ></div>

</section>



<!-- ADMIN APP -->

<section id="app" class="hidden">


<!-- PRODUCT FORM -->

<div class="card">

  <h1 id="formTitle">
    Add Product
  </h1>

  <div
    id="msg"
    class="msg hidden"
  ></div>


  <div class="grid">


    <!-- NAME -->

    <div>

      <label>
        PRODUCT NAME *
      </label>

      <input
        id="name"
        placeholder="Product name"
      >

    </div>



    <!-- PRICE -->

    <div>

      <label>
        PRICE (AED) *
      </label>

      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="250"
      >

    </div>



    <!-- CATEGORY -->

    <div>

      <label>
        CATEGORY *
      </label>

      <select
        id="category"
        onchange="categoryChanged()"
      >

        <option value="SHOES">
          SHOES
        </option>

        <option value="HOODIE">
          HOODIE
        </option>

        <option value="PANTS">
          PANTS
        </option>

        <option value="T-SHIRT">
          T-SHIRT
        </option>

        <option value="STREETWEAR">
          STREETWEAR
        </option>

      </select>

    </div>



    <!-- BRAND -->

    <div id="brandBox">

      <label>
        BRAND
      </label>

      <select id="brand">

        <option value="">
          Other / No Brand
        </option>

        <option>
          ADIDAS
        </option>

        <option>
          NIKE
        </option>

        <option>
          PUMA
        </option>

        <option>
          JORDAN
        </option>

        <option>
          NEW BALANCE
        </option>

        <option>
          LOUIS VUITTON
        </option>

        <option>
          GUCCI
        </option>

        <option>
          BALENCIAGA
        </option>

        <option>
          DIOR
        </option>

        <option>
          PRADA
        </option>

        <option>
          OTHER BRANDS
        </option>

      </select>

    </div>



    <!-- COLORS -->

    <div class="full">

      <label>
        COLORS
      </label>

      <input
        id="colors"
        placeholder="Black, White, Red"
      >

    </div>



    <!-- SHOE SIZES -->

    <div
      id="sizesBox"
      class="full"
    >

      <label>
        SHOE SIZES
      </label>

      <input
        id="shoeSizes"
        placeholder="38, 39, 40, 41, 42, 43, 44"
      >

    </div>



    <!-- PHOTOS -->

    <div class="full">

      <label>
        PRODUCT PHOTOS
      </label>

      <input
        id="files"
        type="file"
        accept="image/*"
        multiple
        onchange="previewFiles()"
      >

      <div
        id="photos"
        class="photos"
      ></div>

      <small>
        You can select multiple photos.
        The first photo becomes the main product photo.
      </small>

    </div>

  </div>



  <!-- BUTTONS -->

  <div
    class="actions"
    style="margin-top:16px"
  >

    <button
      id="saveBtn"
      class="primary"
      onclick="saveProduct()"
    >
      ADD PRODUCT
    </button>

    <button
      id="cancelBtn"
      class="ghost hidden"
      onclick="resetForm()"
    >
      CANCEL EDIT
    </button>

  </div>

</div>



<!-- PRODUCT LIST -->

<div class="card">

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    "
  >

    <h2>
      Products
    </h2>

    <button
      class="ghost small"
      onclick="loadProducts()"
    >
      REFRESH
    </button>

  </div>


  <input
    id="search"
    placeholder="Search products..."
    oninput="renderProducts()"
  >


  <div id="products">

    <p>
      Loading...
    </p>

  </div>

</div>


</section>

</main>



<script>

/* =========================================
   SUPABASE SETTINGS
========================================= */

const SUPABASE_URL =
'https://oqvyrehcqxsmzpunxeys.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a';

const BUCKET =
'products';



/* =========================================
   VARIABLES
========================================= */

let session = null;

let products = [];

let editingId = null;

let selectedFiles = [];

let existingImages = [];



/* =========================================
   SHORTCUT
========================================= */

const $ = id =>
document.getElementById(id);



/* =========================================
   SECURITY ESCAPE
========================================= */

const esc = s =>
String(s ?? '').replace(
  /[&<>"']/g,
  m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m])
);



/* =========================================
   SUPABASE HEADERS
========================================= */

function headers(extra = {}){

  return Object.assign(

    {
      apikey:SUPABASE_KEY,

      Authorization:
      'Bearer ' +
      (
        session?.access_token ||
        SUPABASE_KEY
      ),

      'Content-Type':
      'application/json'

    },

    extra

  );

}



/* =========================================
   MESSAGE
========================================= */

function message(text,error=false){

  $('msg').textContent = text;

  $('msg').classList.remove('hidden');

  $('msg').style.background =
    error
    ? '#ffe5e8'
    : '#eef6ee';

}



/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
  $('email').value.trim();

  const password =
  $('password').value;


  if(!email || !password){

    $('loginMsg').textContent =
    'Enter email and password.';

    $('loginMsg')
    .classList
    .remove('hidden');

    return;
  }


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/auth/v1/token?grant_type=password',

      {
        method:'POST',

        headers:{
          apikey:SUPABASE_KEY,
          'Content-Type':
          'application/json'
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }

    );


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        'Login failed'
      );

    }


    session = data;


    localStorage.setItem(
      'alven_admin_session',
      JSON.stringify(data)
    );


    showApp();

    loadProducts();


  }catch(error){

    $('loginMsg').textContent =
    error.message;

    $('loginMsg')
    .classList
    .remove('hidden');

  }

}



/* =========================================
   RESTORE LOGIN
========================================= */

function restore(){

  try{

    session =
    JSON.parse(
      localStorage.getItem(
        'alven_admin_session'
      ) || 'null'
    );

  }catch(error){

    session = null;

  }


  if(session?.access_token){

    showApp();

    loadProducts();

  }

}



/* =========================================
   SHOW ADMIN
========================================= */

function showApp(){

  $('login')
  .classList
  .add('hidden');

  $('app')
  .classList
  .remove('hidden');

  $('logoutBtn')
  .classList
  .remove('hidden');

}



/* =========================================
   LOGOUT
========================================= */

function logout(){

  localStorage.removeItem(
    'alven_admin_session'
  );

  location.reload();

}



/* =========================================
   CATEGORY
========================================= */

function categoryChanged(){

  const shoes =
  $('category').value === 'SHOES';


  $('sizesBox')
  .classList
  .toggle(
    'hidden',
    !shoes
  );


  $('brandBox')
  .classList
  .toggle(
    'hidden',
    !shoes
  );

}



/* =========================================
   RESET FORM
========================================= */

function resetForm(){

  editingId = null;

  selectedFiles = [];

  existingImages = [];


  $('formTitle').textContent =
  'Add Product';

  $('saveBtn').textContent =
  'ADD PRODUCT';

  $('cancelBtn')
  .classList
  .add('hidden');


  $('name').value = '';

  $('price').value = '';

  $('category').value =
  'SHOES';

  $('brand').value = '';

  $('colors').value = '';

  $('shoeSizes').value = '';

  $('files').value = '';

  $('photos').innerHTML = '';


  categoryChanged();

}



/* =========================================
   PHOTO PREVIEW
========================================= */

function previewFiles(){

  selectedFiles =
  Array.from(
    $('files').files || []
  );

  renderPhotos();

}



/* =========================================
   RENDER PHOTOS
========================================= */

function renderPhotos(){

  const box =
  $('photos');

  box.innerHTML = '';


  /* Existing images */

  existingImages.forEach(
    (url,index)=>{

      const div =
      document.createElement('div');

      div.className =
      'photo';


      div.innerHTML =
      `
      <img src="${esc(url)}">

      <button
        type="button"
        onclick="removeExisting(${index})"
      >
        ×
      </button>
      `;


      box.appendChild(div);

    }
  );



  /* New images */

  selectedFiles.forEach(
    (file,index)=>{

      const div =
      document.createElement('div');

      div.className =
      'photo';


      const img =
      document.createElement('img');

      img.src =
      URL.createObjectURL(file);


      const button =
      document.createElement('button');

      button.type =
      'button';

      button.textContent =
      '×';


      button.onclick = ()=>{

        selectedFiles.splice(
          index,
          1
        );

        renderPhotos();

      };


      div.appendChild(img);

      div.appendChild(button);

      box.appendChild(div);

    }
  );

}



/* =========================================
   REMOVE EXISTING IMAGE
========================================= */

function removeExisting(index){

  existingImages.splice(
    index,
    1
  );

  renderPhotos();

}



/* =========================================
   LIST PARSER
========================================= */

function parseList(value){

  return value
  .split(',')
  .map(x=>x.trim())
  .filter(Boolean);

}



/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadFile(file){

  const extension =
  (
    file.name
    .split('.')
    .pop() ||
    'jpg'
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9]/g,
    ''
  );


  const path =
  'products/' +
  Date.now() +
  '-' +
  Math.random()
  .toString(36)
  .slice(2) +
  '.' +
  extension;


  const response =
  await fetch(

    SUPABASE_URL +
    '/storage/v1/object/' +
    BUCKET +
    '/' +
    path,

    {
      method:'POST',

      headers:{

        apikey:
        SUPABASE_KEY,

        Authorization:
        'Bearer ' +
        (
          session?.access_token ||
          SUPABASE_KEY
        ),

        'Content-Type':
        file.type ||
        'image/jpeg',

        'x-upsert':
        'false'

      },

      body:file

    }

  );


  if(!response.ok){

    throw new Error(
      'Image upload failed: ' +
      await response.text()
    );

  }


  return (

    SUPABASE_URL +

    '/storage/v1/object/public/' +

    BUCKET +

    '/' +

    path

  );

}



/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

  const name =
  $('name').value.trim();

  const price =
  Number(
    $('price').value
  );

  const category =
  $('category').value;


  if(
    !name ||
    !Number.isFinite(price)
  ){

    message(
      'Product name and price are required.',
      true
    );

    return;

  }


  $('saveBtn').disabled =
  true;


  try{

    message(
      'Saving product...'
    );


    let urls =
    [...existingImages];


    /* Upload new photos */

    for(
      const file of selectedFiles
    ){

      const url =
      await uploadFile(file);

      urls.push(url);

    }


    if(!urls.length){

      throw new Error(
        'Please select at least one product photo.'
      );

    }


    const payload = {

      name:name,

      price:price,

      category:category,

      brand:
      category === 'SHOES'
      ? (
          $('brand').value ||
          null
        )
      : null,

      image_url:
      urls[0],

      image_urls:
      urls,

      shoe_sizes:
      category === 'SHOES'
      ? parseList(
          $('shoeSizes').value
        )
      : [],

      colors:
      parseList(
        $('colors').value
      )

    };


    let response;


    /* EDIT */

    if(editingId){

      response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/products?id=eq.' +
        encodeURIComponent(
          editingId
        ),

        {
          method:'PATCH',

          headers:
          headers({
            'Prefer':
            'return=minimal'
          }),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }


    /* ADD */

    else{

      response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/products',

        {
          method:'POST',

          headers:
          headers({
            'Prefer':
            'return=minimal'
          }),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    message(
      editingId
      ? 'Product updated successfully.'
      : 'Product added successfully.'
    );


    resetForm();

    await loadProducts();


  }catch(error){

    message(
      error.message,
      true
    );

  }finally{

    $('saveBtn').disabled =
    false;

  }

}



/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  $('products').innerHTML =
  '<p>Loading...</p>';


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/products?' +
      'select=id,name,price,category,brand,image_url,image_urls,shoe_sizes,colors' +
      '&order=id.desc',

      {
        headers:
        headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    products =
    await response.json();


    renderProducts();


  }catch(error){

    $('products').innerHTML =
    `
    <div class="msg">
      ${esc(error.message)}
    </div>
    `;

  }

}



/* =========================================
   GET PRODUCT IMAGES
========================================= */

function imgs(product){

  if(
    Array.isArray(
      product.image_urls
    ) &&
    product.image_urls.length
  ){

    return product.image_urls;

  }


  if(
    typeof product.image_urls ===
    'string'
  ){

    try{

      const array =
      JSON.parse(
        product.image_urls
      );

      if(
        Array.isArray(array)
      ){

        return array;

      }

    }catch(error){}

  }


  return product.image_url
  ? [product.image_url]
  : [];

}



/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const query =
  $('search')
  .value
  .toLowerCase()
  .trim();


  const list =
  products.filter(
    product =>

    !query ||

    [
      product.name,
      product.category,
      product.brand
    ]
    .join(' ')
    .toLowerCase()
    .includes(query)

  );


  if(!list.length){

    $('products').innerHTML =
    '<p>No products found.</p>';

    return;

  }


  $('products').innerHTML =
  list.map(
    product => {

      const image =
      imgs(product)[0] ||
      '';


      return `

      <div class="product">

        <img
          src="${esc(image)}"
          alt=""
        >

        <div>

          <b>
            ${esc(product.name)}
          </b>

          <div class="meta">

            AED
            ${Number(
              product.price || 0
            ).toFixed(0)}

            ·

            ${esc(
              product.category || ''
            )}

            ${
              product.brand
              ? ' · ' +
                esc(product.brand)
              : ''
            }

          </div>

        </div>


        <div class="actions">

          <button
            class="ghost small"
            onclick='editProduct(${JSON.stringify(String(product.id))})'
          >
            EDIT
          </button>


          <button
            class="danger small"
            onclick='deleteProduct(${JSON.stringify(String(product.id))})'
          >
            DELETE
          </button>

        </div>

      </div>

      `;

    }
  ).join('');

}



/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

  const product =
  products.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(!product){
    return;
  }


  editingId =
  product.id;


  existingImages =
  imgs(product);


  selectedFiles =
  [];


  $('formTitle').textContent =
  'Edit Product';

  $('saveBtn').textContent =
  'UPDATE PRODUCT';

  $('cancelBtn')
  .classList
  .remove('hidden');


  $('name').value =
  product.name || '';


  $('price').value =
  product.price ?? '';


  $('category').value =
  product.category ||
  'SHOES';


  $('brand').value =
  product.brand || '';


  if(
    Array.isArray(
      product.colors
    )
  ){

    $('colors').value =
    product.colors.join(', ');

  }else{

    $('colors').value =
    product.colors || '';

  }


  let sizes =
  product.shoe_sizes;


  if(
    typeof sizes ===
    'string'
  ){

    try{

      sizes =
      JSON.parse(sizes);

    }catch(error){

      sizes =
      parseList(sizes);

    }

  }


  $('shoeSizes').value =
  Array.isArray(sizes)
  ? sizes.join(', ')
  : '';


  $('files').value =
  '';


  renderPhotos();

  categoryChanged();


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}



/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

  const product =
  products.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(
    !product ||
    !confirm(
      'Delete "' +
      product.name +
      '"?'
    )
  ){

    return;

  }


  try{

    const response =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/products?id=eq.' +
      encodeURIComponent(id),

      {
        method:'DELETE',

        headers:
        headers()
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    await loadProducts();

    message(
      'Product deleted.'
    );


  }catch(error){

    message(
      error.message,
      true
    );

  }

}

categoryChanged();

restore();

</script>
