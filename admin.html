<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALVÉN Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}
header{
  background:#000;
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:22px}
button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}
.black{background:#000;color:#fff}
.red{background:#d00;color:#fff}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #ddd;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}
textarea{min-height:90px}
h2{margin-top:0}
.hidden{display:none}
.order{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
}
.order-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.item{
  background:#f7f7f7;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}
.product{
  display:flex;
  gap:15px;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:12px 0;
}
.product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
}
.product-info{flex:1}
.login-box{
  max-width:420px;
  margin:80px auto;
}
.status{
  min-width:160px;
}
.total{
  font-size:18px;
  font-weight:bold;
}
.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>ALVÉN ADMIN</h1>
  <button id="logoutBtn" class="red hidden">Logout</button>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginSection" class="card login-box">
  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn" class="black" style="width:100%">
    Sign In
  </button>

  <p id="loginMessage"></p>
</div>


<!-- ADMIN -->
<div id="adminSection" class="hidden">

  <!-- ORDERS -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>Orders</h2>
      <button id="refreshOrders" class="black">
        Refresh Orders
      </button>
    </div>

    <div id="ordersList">
      Loading orders...
    </div>
  </div>


  <!-- ADD PRODUCT -->
  <div class="card">
    <h2>Add Product</h2>

    <input id="productName" placeholder="Product name">

    <input id="productPrice" type="number" placeholder="Price AED">

    <input id="productCategory" placeholder="Category">

    <input id="productBrand" placeholder="Brand">

    <input id="productImage" placeholder="Main image URL">

    <input id="productImages" placeholder="Other image URLs, separated by comma">

    <input id="productSizes" placeholder="Shoe sizes, example: 39,40,41,42">

    <input id="productColors" placeholder="Colors, example: Black,White,Red">

    <button id="addProductBtn" class="black">
      Add Product
    </button>

    <p id="productMessage"></p>
  </div>


  <!-- PRODUCTS -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2>Products</h2>
      <button id="refreshProducts" class="black">
        Refresh
      </button>
    </div>

    <div id="productsList">
      Loading products...
    </div>
  </div>

</div>
</div>


<script>

const SUPABASE_URL =
'https://oqvyrehcqxsmzpunxeys.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a';

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ELEMENTS */

const loginSection =
document.getElementById('loginSection');

const adminSection =
document.getElementById('adminSection');

const logoutBtn =
document.getElementById('logoutBtn');

const loginMessage =
document.getElementById('loginMessage');


/* LOGIN */

document.getElementById('loginBtn').onclick =
async function(){

  const email =
  document.getElementById('email').value.trim();

  const password =
  document.getElementById('password').value;

  if(!email || !password){
    loginMessage.textContent =
    'Enter email and password.';
    return;
  }

  loginMessage.textContent =
  'Signing in...';

  const {data,error} =
  await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    loginMessage.textContent =
    error.message;
    return;
  }

  showAdmin();
};


/* LOGOUT */

logoutBtn.onclick =
async function(){

  await db.auth.signOut();

  loginSection.classList.remove('hidden');
  adminSection.classList.add('hidden');
  logoutBtn.classList.add('hidden');
};


/* SHOW ADMIN */

function showAdmin(){

  loginSection.classList.add('hidden');
  adminSection.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');

  loadOrders();
  loadProducts();
}


/* CHECK SESSION */

async function checkSession(){

  const {data} =
  await db.auth.getSession();

  if(data.session){
    showAdmin();
  }
}

checkSession();


/* ORDERS */

async function loadOrders(){

  const list =
  document.getElementById('ordersList');

  list.innerHTML =
  'Loading orders...';

  const {data,error} =
  await db
  .from('orders')
  .select('*')
  .order('created_at',{ascending:false});

  if(error){
    list.innerHTML =
    '<p>Could not load orders: '+
    error.message+
    '</p>';
    return;
  }

  if(!data || data.length===0){
    list.innerHTML =
    '<p>No orders yet.</p>';
    return;
  }

  list.innerHTML='';

  data.forEach(order=>{

    const div =
    document.createElement('div');

    div.className='order';

    let itemsHTML='';

    let items=order.items;

    if(typeof items==='string'){
      try{
        items=JSON.parse(items);
      }catch(e){
        items=[];
      }
    }

    if(!Array.isArray(items)){
      items=[];
    }

    items.forEach(item=>{

      itemsHTML += `
        <div class="item">
          <strong>${escapeHTML(item.name || 'Product')}</strong><br>
          Quantity: ${escapeHTML(String(item.quantity || 1))}<br>
          ${item.color ? 'Color: '+escapeHTML(item.color)+'<br>' : ''}
          ${item.size ? 'Size: '+escapeHTML(item.size)+'<br>' : ''}
          Price: AED ${Number(item.price || 0).toFixed(2)}
        </div>
      `;

    });


    div.innerHTML=`

      <div class="order-header">

        <div>
          <strong>Order #${escapeHTML(String(order.id))}</strong>

          <div class="small">
            ${order.created_at
              ? new Date(order.created_at).toLocaleString()
              : ''}
          </div>
        </div>

        <select class="status" data-id="${order.id}">
          <option value="NEW"
            ${order.status==='NEW'?'selected':''}>
            New
          </option>

          <option value="CONFIRMED"
            ${order.status==='CONFIRMED'?'selected':''}>
            Confirmed
          </option>

          <option value="SHIPPED"
            ${order.status==='SHIPPED'?'selected':''}>
            Shipped
          </option>

          <option value="DELIVERED"
            ${order.status==='DELIVERED'?'selected':''}>
            Delivered
          </option>

          <option value="CANCELLED"
            ${order.status==='CANCELLED'?'selected':''}>
            Cancelled
          </option>
        </select>

      </div>


      <hr>

      <strong>Customer</strong>

      <p>
        Name: ${escapeHTML(order.customer_name || '')}<br>
        Phone: ${escapeHTML(order.phone || '')}<br>
        Address: ${escapeHTML(order.address || '')}<br>
        City: ${escapeHTML(order.city || '')}<br>
        ${order.notes
          ? 'Notes: '+escapeHTML(order.notes)
          : ''}
      </p>


      <strong>Payment</strong>

      <p>
        ${escapeHTML(order.payment_method || 'PAY_ON_DELIVERY')}
      </p>


      <strong>Products</strong>

      ${itemsHTML}


      <p class="total">
        Total: AED ${Number(order.total || 0).toFixed(2)}
      </p>
    `;


    const select =
    div.querySelector('.status');

    select.addEventListener('change',
    async function(){

      const newStatus =
      this.value;

      const {error} =
      await db
      .from('orders')
      .update({
        status:newStatus
      })
      .eq('id',order.id);

      if(error){

        alert(
          'Could not update order: '+
          error.message
        );

        loadOrders();

      }

    });


    list.appendChild(div);

  });

}


/* REFRESH ORDERS */

document.getElementById('refreshOrders')
.onclick =
loadOrders;


/* PRODUCTS */

async function loadProducts(){

  const list =
  document.getElementById('productsList');

  list.innerHTML =
  'Loading products...';

  const {data,error} =
  await db
  .from('products')
  .select('*')
  .order('id',{ascending:false});

  if(error){
    list.innerHTML =
    '<p>Could not load products: '+
    error.message+
    '</p>';
    return;
  }

  if(!data || data.length===0){
    list.innerHTML =
    '<p>No products yet.</p>';
    return;
  }

  list.innerHTML='';

  data.forEach(product=>{

    const div =
    document.createElement('div');

    div.className='product';

    div.innerHTML=`

      <img
        src="${escapeHTML(product.image_url || '')}"
        onerror="this.style.display='none'"
      >

      <div class="product-info">

        <strong>
          ${escapeHTML(product.name || '')}
        </strong>

        <div>
          AED ${Number(product.price || 0).toFixed(2)}
        </div>

        <div class="small">
          ${escapeHTML(product.category || '')}
          ${product.brand
            ? ' • '+escapeHTML(product.brand)
            : ''}
        </div>

        ${
          product.colors
          ? '<div class="small">Colors: '+
            escapeHTML(product.colors)+
            '</div>'
          : ''
        }

        ${
          product.shoe_sizes
          ? '<div class="small">Sizes: '+
            escapeHTML(product.shoe_sizes)+
            '</div>'
          : ''
        }

      </div>

      <button
        class="red delete-product"
        data-id="${product.id}">
        Delete
      </button>

    `;

    div.querySelector('.delete-product')
    .onclick =
    async function(){

      if(!confirm(
        'Delete this product?'
      )){
        return;
      }

      const {error} =
      await db
      .from('products')
      .delete()
      .eq('id',product.id);

      if(error){

        alert(
          'Could not delete product: '+
          error.message
        );

        return;
      }

      loadProducts();

    };

    list.appendChild(div);

  });

}


/* REFRESH PRODUCTS */

document.getElementById('refreshProducts')
.onclick =
loadProducts;


/* ADD PRODUCT */

document.getElementById('addProductBtn')
.onclick =
async function(){

  const name =
  document.getElementById('productName')
  .value.trim();

  const price =
  Number(
    document.getElementById('productPrice')
    .value
  );

  const category =
  document.getElementById('productCategory')
  .value.trim();

  const brand =
  document.getElementById('productBrand')
  .value.trim();

  const image_url =
  document.getElementById('productImage')
  .value.trim();

  const imagesText =
  document.getElementById('productImages')
  .value.trim();

  const shoe_sizes =
  document.getElementById('productSizes')
  .value.trim();

  const colors =
  document.getElementById('productColors')
  .value.trim();

  const message =
  document.getElementById('productMessage');


  if(!name || !price || !image_url){

    message.textContent =
    'Product name, price and image URL are required.';

    return;
  }


  const image_urls =
  imagesText
  ? imagesText
      .split(',')
      .map(x=>x.trim())
      .filter(Boolean)
  : [];


  const {error} =
  await db
  .from('products')
  .insert({

    name:name,
    price:price,
    category:category,
    brand:brand,
    image_url:image_url,
    image_urls:image_urls,
    shoe_sizes:shoe_sizes,
    colors:colors

  });


  if(error){

    message.textContent =
    'Error: '+error.message;

    return;
  }


  message.textContent =
  'Product added successfully.';


  document.getElementById('productName').value='';
  document.getElementById('productPrice').value='';
  document.getElementById('productCategory').value='';
  document.getElementById('productBrand').value='';
  document.getElementById('productImage').value='';
  document.getElementById('productImages').value='';
  document.getElementById('productSizes').value='';
  document.getElementById('productColors').value='';


  loadProducts();

};


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

</script>

</body>
</html>
