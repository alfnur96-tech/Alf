<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALVÉN Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f7f5ef;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.brand{text-align:center;margin-bottom:22px}.brand img{width:100px;height:100px;object-fit:contain}.brand h1{margin:5px 0;letter-spacing:.18em}.panel{background:#191919;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:18px}input,select,textarea{width:100%;padding:13px;background:#0f0f0f;border:1px solid #444;color:#fff;border-radius:8px;margin:7px 0 12px;font:inherit}textarea{min-height:80px}button{padding:13px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111}.danger{background:#b33;color:#fff}.muted{color:#aaa;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}.card .body{padding:12px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.hidden{display:none}.size-options{display:flex;flex-wrap:wrap;gap:8px;margin:7px 0 12px}.size-options label{display:flex;align-items:center;gap:5px;background:#0f0f0f;border:1px solid #444;padding:9px 11px;border-radius:8px;cursor:pointer}.size-options input{width:auto;margin:0}.preview{max-width:180px;max-height:180px;display:none;margin:8px 0;border-radius:8px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.error{color:#ff8585}.ok{color:#8cff9b}.order{background:#111;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}.orderhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.orderitems{margin:12px 0;padding:10px;background:#181818;border-radius:8px}.item{padding:8px 0;border-bottom:1px solid #333}.item:last-child{border-bottom:0}.badge{display:inline-block;padding:6px 9px;border-radius:20px;background:#333;font-size:11px}.ordergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.statusrow{display:flex;gap:8px;align-items:center;margin-top:12px}.statusrow select{max-width:180px;margin:0}.refresh{margin-left:8px}@media(max-width:750px){.grid,.products,.ordergrid{grid-template-columns:1fr}.top{display:block}.top button{margin-top:10px}.orderhead{display:block}}
</style>
</head>
<body>
<div class="wrap">

<div class="brand">
<img src="alven-logo.jpg" alt="ALVÉN">
<h1>ALVÉN</h1>
<div class="muted">ADMIN PANEL</div>
</div>

<section id="login" class="panel">
<h2>Admin Sign In</h2>
<div class="muted">Sign in with your Supabase admin account.</div>
<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" class="primary">SIGN IN</button>
<p id="loginMsg" class="error"></p>
</section>

<section id="app" class="hidden">

<div class="panel top">
<div>
<b>ALVÉN Admin</b>
<div class="muted">Products + customer orders</div>
</div>
<div>
<button class="primary" onclick="openStore()">OPEN SHOP</button>
<button id="logoutBtn">LOG OUT</button>
</div>
</div>

<section class="panel">
<div class="top">
<div>
<h2 style="margin:0">Orders</h2>
<div class="muted">Customer orders placed through the website.</div>
</div>
<button class="primary refresh" onclick="loadOrders()">REFRESH ORDERS</button>
</div>

<p id="ordersMsg"></p>
<div id="orders">
<div class="muted">Loading orders...</div>
</div>
</section>

<section class="panel">
<h2>Add Product</h2>

<div class="grid">

<div>
<label>Product name</label>
<input id="name" placeholder="e.g. ALVÉN Hoodie">
</div>

<div>
<label>Price (AED)</label>
<input id="price" type="number" min="0" step="1" placeholder="150">
</div>

<div>
<label>Category</label>
<select id="category">
<option>SHOES</option>
<option>HOODIE</option>
<option>PANTS</option>
<option>T-SHIRT</option>
</select>
</div>

<div id="brandWrap">
<label>Shoe brand</label>
<select id="brand">
<option>ADIDAS</option>
<option>NIKE</option>
<option>PUMA</option>
<option>JORDAN</option>
<option>NEW BALANCE</option>
<option>LOUIS VUITTON</option>
<option>GUCCI</option>
<option>BALENCIAGA</option>
<option>DIOR</option>
<option>PRADA</option>
<option>OTHER BRANDS</option>
</select>

<label>Shoe number</label>
<div id="shoeSizes" class="size-options"></div>
<div class="muted">Select all available shoe numbers.</div>
</div>

<div>
<label>Product colors</label>
<input id="colors" placeholder="Black, White, Red">
<div class="muted">Separate multiple colors with commas.</div>
</div>

<div>
<label>Product image — choose from phone gallery</label>
<input id="image" type="file" accept="image/*" multiple>
<img id="preview" class="preview" alt="Preview">
</div>

</div>

<button id="addBtn" class="primary">UPLOAD IMAGE + ADD PRODUCT</button>
<p id="msg"></p>
</section>

<section class="panel">
<h2>Products</h2>
<div id="products" class="products">
<div class="muted">Loading...</div>
</div>
</section>

</section>
</div>

<script>
const SUPABASE_URL='https://oqvyrehcqxsmzpunxeys.supabase.co',
SUPABASE_KEY='sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a',
BUCKET='product-images';

let db=null;
let brandAvailable=true;
let sizeAvailable=true;
let colorsAvailable=true;

const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

function init(){
if(typeof supabase==='undefined')return false;

db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true,
flowType:'pkce'
}
}
);

return true;
}

function msg(t,ok=false){
$('msg').textContent=t;
$('msg').className=ok?'ok':'error';
}

function sizes(){
return [...document.querySelectorAll('#shoeSizes input:checked')].map(x=>x.value);
}

function makeSizeBoxes(){
let a=[];
for(let n=36;n<=47;n++){
a.push(`<label><input type="checkbox" value="${n}"> ${n}</label>`);
}
$('shoeSizes').innerHTML=a.join('');
}

function parseColors(v){
if(Array.isArray(v))
return v.map(String).map(x=>x.trim()).filter(Boolean);

if(!v)return[];

return String(v)
.split(',')
.map(x=>x.trim())
.filter(Boolean);
}

function colorsText(a){
return parseColors(a).join(', ');
}

function updateCategoryUI(){
$('brandWrap').classList.toggle(
'hidden',
$('category').value!=='SHOES'
);
}

$('category').onchange=updateCategoryUI;

makeSizeBoxes();
updateCategoryUI();

$('image').onchange=e=>{
const f=[...(e.target.files||[])];

if(!f.length){
$('preview').style.display='none';
return;
}

$('preview').src=URL.createObjectURL(f[0]);
$('preview').style.display='block';
$('msg').textContent=f.length+' photo(s) selected.';
};

async function loadProducts(){

let r=await db
.from('products')
.select('id,name,price,category,brand,colors,shoe_sizes,image_url,image_urls')
.order('id',{ascending:false});

if(r.error)
r=await db
.from('products')
.select('id,name,price,category,brand,shoe_sizes,image_url,image_urls')
.order('id',{ascending:false});

if(r.error&&/brand/i.test(r.error.message||'')){
brandAvailable=false;

r=await db
.from('products')
.select('id,name,price,category,shoe_sizes,image_url')
.order('id',{ascending:false});
}

if(r.error){
$('products').innerHTML=
'<div class="error">'+esc(r.error.message)+'</div>';
return;
}

$('products').innerHTML=(r.data||[]).map(p=>`

<article class="card">

<img src="${esc(p.image_url||'')}" alt="${esc(p.name)}">

<div class="body">

<b>${esc(p.name||'')}</b>

<div class="muted">
AED ${Number(p.price||0).toFixed(0)}
· ${esc(p.category||'')}
${p.brand?' · '+esc(p.brand):''}
${p.shoe_sizes?.length?' · Sizes: '+esc(p.shoe_sizes.join(', ')):''}
${p.colors?' · Colors: '+esc(colorsText(p.colors)):''}
${p.image_urls?.length>1?' · '+p.image_urls.length+' photos':''}
</div>

<div class="actions">

<button onclick='editProduct(${JSON.stringify(p).replace(/</g,'\\u003c')})'>
EDIT
</button>

<button
class="danger"
onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">
DELETE
</button>

</div>

</div>

</article>

`).join('')||'<div class="muted">No products yet.</div>';
}

async function add(){

const name=$('name').value.trim();
const price=Number($('price').value);
const category=$('category').value;
const brand=category==='SHOES'?$(
'brand'
).value:null;

const shoe_sizes=category==='SHOES'?sizes():[];

const colors=parseColors($('colors').value);

const files=[...($('image').files||[])];

if(!name||!Number.isFinite(price)||!files.length){
msg('Enter name, price and choose one or more photos.');
return;
}

if(category==='SHOES'&&!shoe_sizes.length){
msg('Select at least one shoe number.');
return;
}

$('addBtn').disabled=true;
$('addBtn').textContent='UPLOADING PHOTOS...';
msg('');

try{

const urls=[];

for(const file of files){

const ext=(file.name.split('.').pop()||'jpg')
.toLowerCase()
.replace(/[^a-z0-9]/g,'')||'jpg';

const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;

const up=await db
.storage
.from(BUCKET)
.upload(
path,
file,
{
contentType:file.type||'image/jpeg',
upsert:false
}
);

if(up.error)throw up.error;

urls.push(
db.storage
.from(BUCKET)
.getPublicUrl(path)
.data.publicUrl
);

}

let payload={
name,
price,
category,
image_url:urls[0],
image_urls:urls
};

if(category==='SHOES'&&sizeAvailable)
payload.shoe_sizes=shoe_sizes;

if(brandAvailable)
payload.brand=brand;

if(colorsAvailable)
payload.colors=colorsText(colors);

let ins=await db
.from('products')
.insert(payload)
.select()
.single();

if(ins.error&&/colors/i.test(ins.error.message||'')){
delete payload.colors;
colorsAvailable=false;

ins=await db
.from('products')
.insert(payload)
.select()
.single();
}

if(ins.error&&/shoe_sizes/i.test(ins.error.message||'')){
delete payload.shoe_sizes;
sizeAvailable=false;

ins=await db
.from('products')
.insert(payload)
.select()
.single();
}

if(ins.error&&/image_urls/i.test(ins.error.message||'')){
delete payload.image_urls;

ins=await db
.from('products')
.insert(payload)
.select()
.single();
}

if(ins.error&&/brand/i.test(ins.error.message||'')){
delete payload.brand;
brandAvailable=false;

ins=await db
.from('products')
.insert(payload)
.select()
.single();
}

if(ins.error)throw ins.error;

$('name').value='';
$('price').value='';
$('colors').value='';
$('image').value='';
$('preview').style.display='none';

document
.querySelectorAll('#shoeSizes input')
.forEach(x=>x.checked=false);

msg('Product added successfully.',true);

await loadProducts();

}catch(e){

msg(e.message||'Upload failed.');

}finally{

$('addBtn').disabled=false;
$('addBtn').textContent='UPLOAD IMAGE + ADD PRODUCT';

}
}

async function deleteProduct(id){

if(!confirm('Delete this product?'))return;

const r=await db
.from('products')
.delete()
.eq('id',id);

if(r.error)
alert(r.error.message);
else
loadProducts();
}

async function editProduct(p){

const name=prompt(
'Product name:',
p.name||''
);

if(name===null)return;

const price=prompt(
'Price (AED):',
p.price??''
);

if(price===null)return;

const category=prompt(
'Category:',
p.category||''
);

if(category===null)return;

const u={
name:name.trim(),
price:Number(price),
category:category.trim()
};

const c=category.trim().toUpperCase();

if(c==='SHOES'&&sizeAvailable){

const raw=prompt(
'Shoe numbers (comma separated):',
p.shoe_sizes?.join(', ')||'38, 39, 40'
);

if(raw===null)return;

u.shoe_sizes=raw
.split(',')
.map(x=>x.trim())
.filter(Boolean);
}

if(brandAvailable&&c==='SHOES'){

const b=prompt(
'Shoe brand:',
p.brand||'NIKE'
);

if(b!==null)
u.brand=b.trim().toUpperCase();

}

if(colorsAvailable){

const raw=prompt(
'Product colors (comma separated):',
colorsText(p.colors)
);

if(raw===null)return;

u.colors=colorsText(raw);
}

const r=await db
.from('products')
.update(u)
.eq('id',p.id);

if(r.error)
alert(r.error.message);
else
loadProducts();
}

function itemHtml(x){

return `
<div class="item">

<b>${esc(x.name||'Product')}</b>
× ${Number(x.qty||1)}

${x.color?' · Color: '+esc(x.color):''}

${x.size?' · Size: '+esc(x.size):''}

<br>

<span class="muted">
AED ${Number(x.price||0).toFixed(0)} each
</span>

</div>
`;
}

function statusOptions(status){

return [
'NEW',
'CONFIRMED',
'SHIPPED',
'DELIVERED',
'CANCELLED'
]
.map(s=>`
<option ${s===status?'selected':''}>
${s}
</option>
`)
.join('');
}

async function loadOrders(){

$('orders').innerHTML=
'<div class="muted">Loading orders...</div>';

const r=await db
.from('orders')
.select(
'id,created_at,customer_name,phone,address,city,notes,payment_method,items,total,status'
)
.order(
'created_at',
{ascending:false}
);

if(r.error){

$('orders').innerHTML=
'<div class="error">'+
esc(r.error.message)+
'<br><small>Make sure the orders table and RLS policies are created.</small>'+
'</div>';

return;
}

$('orders').innerHTML=(r.data||[])
.map(o=>{

let items=Array.isArray(o.items)
?o.items
:[];

let date=new Date(o.created_at)
.toLocaleString();

return `

<article class="order">

<div class="orderhead">

<div>

<b>Order #${esc(o.id)}</b>

<div class="muted">
${esc(date)}
</div>

</div>

<span class="badge">
${esc(o.status||'NEW')}
</span>

</div>

<div
class="ordergrid"
style="margin-top:12px"
>

<div>
<b>Customer</b><br>
${esc(o.customer_name)}
</div>

<div>
<b>Phone</b><br>
${esc(o.phone)}
</div>

<div>
<b>Address</b><br>
${esc(o.address)}
</div>

<div>
<b>City</b><br>
${esc(o.city||'')}
</div>

<div>
<b>Payment</b><br>
${esc(o.payment_method||'')}
</div>

<div>
<b>Total</b><br>
AED ${Number(o.total||0).toFixed(0)}
</div>

</div>

<div class="orderitems">

<b>Products</b>

${items.map(itemHtml).join('')}

</div>

${o.notes?
`<div class="muted">
<b>Notes:</b> ${esc(o.notes)}
</div>`
:''}

<div class="statusrow">

<b>Status:</b>

<select
onchange="updateOrderStatus('${String(o.id).replace(/'/g,"\\'")}',this.value)"
>

${statusOptions(o.status||'NEW')}

</select>

</div>

</article>
`;

})
.join('')||'<div class="muted">No orders yet.</div>';
}

async function updateOrderStatus(id,status){

const r=await db
.from('orders')
.update({status})
.eq('id',id);

if(r.error){

alert(r.error.message);
await loadOrders();

}else{

await loadOrders();

}
}

function openStore(){

window.open(
location.protocol==='file:'
?'index.html#shop'
:location.origin+'/#shop',
'_blank'
);

}

$('addBtn').onclick=add;

$('logoutBtn').onclick=async()=>{
await db.auth.signOut();
location.reload();
};

$('loginBtn').onclick=async()=>{

const email=$('email').value.trim();
const password=$('password').value;

if(!db){
$('loginMsg').textContent=
'Admin connection is not ready.';
return;
}

if(!email||!password){
$('loginMsg').textContent=
'Enter your email and password.';
return;
}

$('loginBtn').disabled=true;
$('loginBtn').textContent='SIGNING IN...';

try{

const r=await db.auth.signInWithPassword({
email,
password
});

if(r.error)
throw r.error;

if(!r.data.session)
throw new Error(
'No login session was created.'
);

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

await loadProducts();
await loadOrders();

}catch(e){

$('loginMsg').textContent=
e.message||'Sign in failed.';

}finally{

$('loginBtn').disabled=false;
$('loginBtn').textContent='SIGN IN';

}
};

if(init()){

db.auth.onAuthStateChange(
(event,session)=>{

if(session){

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

loadProducts();
loadOrders();

}else if(event==='SIGNED_OUT'){

$('login').classList.remove('hidden');
$('app').classList.add('hidden');

}

});

db.auth.getSession()
.then(async({data,error})=>{

if(error){

$('loginMsg').textContent=error.message;
return;

}

if(data.session){

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

await loadProducts();
await loadOrders();

}

});

}

</script>
</body>
  </html>
