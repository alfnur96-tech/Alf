<script>
const URL='https://oqvyrehcqxsmzpunxeys.supabase.co',KEY='sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a',db=supabase.createClient(URL,KEY);let products=[],cat='ALL',selected=null,color='',size='',qty=1,cart=JSON.parse(localStorage.getItem('alven_cart')||'[]');
