<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALVÉN Product</title>
<meta name="description" content="View ALVÉN product details, images, price and available sizes.">
<meta property="og:type" content="product">
<meta property="og:site_name" content="ALVÉN">
<link id="canonical" rel="canonical" href="https://alvenal.vercel.app/product.html">
<style>
:root{--bg:#f5f3ee;--ink:#111;--muted:#777;--line:#ddd8cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.nav{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(245,243,238,.95)}.logo{font-weight:900;letter-spacing:.18em;font-size:22px;display:flex;align-items:center;gap:10px}.logo img{width:42px;height:42px;object-fit:contain}.links{display:flex;gap:24px;text-transform:uppercase;letter-spacing:.12em;font-size:11px}main{max-width:1100px;margin:auto;padding:50px 5% 90px}.product{display:grid;grid-template-columns:1.1fr .9fr;gap:45px}.photo{background:#e8e5df;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:70px;height:80px;object-fit:cover;cursor:pointer}.kicker{font-size:10px;color:#777;letter-spacing:.2em}.info h1{font-size:clamp(36px,6vw,70px);letter-spacing:-.06em;margin:12px 0}.price{font-size:22px;font-weight:700}.muted{color:#777;line-height:1.7}.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.size{border:1px solid #aaa;padding:10px 14px}.btn{display:inline-block;background:#111;color:#fff;padding:15px 22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}@media(max-width:800px){.links{display:none}.product{grid-template-columns:1fr;gap:25px}}
</style></head><body>
<nav class="nav"><a class="logo" href="/"><img src="alven-logo.jpg" alt="ALVÉN logo"><span>ALVÉN</span></a><div class="links"><a href="/shop.html">Shop</a><a href="/products.html">Products</a><a href="/about.html">About</a><a href="/shipping.html">Shipping</a><a href="/contact.html">Contact</a></div></nav>
<main id="app"><p>Loading product…</p></main>
<script>
const SUPABASE_URL='https://oqvyrehcqxsmzpunxeys.supabase.co';
const SUPABASE_KEY='sb_publishable_-_viWClT_hTFWK8spDeUaw_RB0hFL9a'; 
// The key above is replaced below at build time if index.html contains a current public key.
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function imgs(p){if(Array.isArray(p.image_urls)&&p.image_urls.length)return p.image_urls;if(typeof p.image_urls==="string"){try{let a=JSON.parse(p.image_urls);if(Array.isArray(a)&&a.length)return a}catch(e){}}return p.image_url?[p.image_url]:[]}
function sizes(p){let a=p.shoe_sizes;if(typeof a==='string'){try{a=JSON.parse(a)}catch(e){a=a.split(',')}}return Array.isArray(a)?a.map(x=>String(x).trim()).filter(Boolean):[]}
function setSEO(p, image){
 document.title=(p.name||'ALVÉN')+' | ALVÉN';
 document.querySelector('meta[name="description"]').content='Shop '+(p.name||'ALVÉN')+' from ALVÉN. Price AED '+Number(p.price||0).toFixed(0)+(p.brand?' · '+p.brand:'')+'.';
 const url=location.origin+location.pathname+'?id='+encodeURIComponent(p.id);
 document.getElementById('canonical').href=url;
 let og=document.querySelector('meta[property="og:title"]'); if(!og){og=document.createElement('meta');og.setAttribute('property','og:title');document.head.appendChild(og)} og.content=(p.name||'ALVÉN')+' | ALVÉN';
 let oi=document.querySelector('meta[property="og:image"]'); if(!oi){oi=document.createElement('meta');oi.setAttribute('property','og:image');document.head.appendChild(oi)} oi.content=image||'';
 const data={"@context":"https://schema.org","@type":"Product","name":p.name||'ALVÉN product',"image":imgs(p),"brand":{"@type":"Brand","name":p.brand||"ALVÉN"},"offers":{"@type":"Offer","priceCurrency":"AED","price":Number(p.price||0).toFixed(2),"availability":"https://schema.org/InStock","url":url}};
 const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(data);document.head.appendChild(s);
}
async function load(){
 const id=new URLSearchParams(location.search).get('id'); if(!id){document.getElementById('app').innerHTML='<h1>Product not found</h1><a class="btn" href="/shop.html">BACK TO SHOP</a>';return}
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=id,name,price,category,brand,image_url,image_urls,shoe_sizes&id=eq.'+encodeURIComponent(id),{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  if(!r.ok)throw new Error('HTTP '+r.status); const a=await r.json(); const p=a[0]; if(!p)throw new Error('Not found');
  const im=imgs(p); setSEO(p,im[0]||'');
  document.getElementById('app').innerHTML='<div class="product"><div><div class="photo"><img id="main" src="'+esc(im[0]||'')+'" alt="'+esc(p.name||'ALVÉN')+'"></div><div class="thumbs">'+im.map((u,i)=>'<img src="'+esc(u)+'" alt="'+esc(p.name||'')+' image '+(i+1)+'" onclick="document.getElementById(\'main\').src=this.src">').join('')+'</div></div><div class="info"><div class="kicker">'+esc(p.category||'PRODUCT')+(p.brand?' · '+esc(p.brand):'')+'</div><h1>'+esc(p.name||'ALVÉN')+'</h1><div class="price">AED '+Number(p.price||0).toFixed(0)+'</div><p class="muted">Available from ALVÉN. Check the available sizes and contact us to confirm your order and delivery details.</p>'+(sizes(p).length?'<h3>Available sizes</h3><div class="sizes">'+sizes(p).map(s=>'<span class="size">'+esc(s)+'</span>').join('')+'</div>':'')+'<a class="btn" href="/shop.html">BACK TO SHOP</a></div></div>';
 }catch(e){document.getElementById('app').innerHTML='<h1>Product unavailable</h1><p class="muted">This product could not be loaded.</p><a class="btn" href="/shop.html">BACK TO SHOP</a>'}
}
load();
</script></body></html>
